<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basics of Ethics · End-Sem Study Guide</title>
<style>
:root{--bg:#faf8f3;--panel:#f2eee4;--ink:#1f1d1a;--muted:#6b665c;--line:#ddd6c6;--accent:#8a5a1f;--accent2:#2f5d8a;--hl:#fff3c4;--quote:#f5efdf;--w:46rem}
[data-theme=dark]{--bg:#16161a;--panel:#1e1e24;--ink:#e6e2da;--muted:#9a958b;--line:#33333b;--accent:#d9a45b;--accent2:#7fb0e0;--hl:#4a3f12;--quote:#23211b}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-family:Inter,sans-serif}
header .title{font-weight:700;font-size:.95rem;white-space:nowrap}
header .title span{color:var(--accent)}
#q{flex:1;min-width:0;max-width:22rem;margin-left:auto;padding:.45rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:.85rem}
button.ic{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:.4rem .6rem;cursor:pointer;font:500 .8rem Inter,sans-serif}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:30;width:0}
.wrap{display:grid;grid-template-columns:17rem minmax(0,1fr);max-width:84rem;margin:0 auto}
nav{position:sticky;top:3.2rem;height:calc(100vh - 3.2rem);overflow:auto;padding:1.2rem .8rem 2rem 1.2rem;border-right:1px solid var(--line);font:.82rem/1.45 Inter,sans-serif}
nav a{display:block;color:var(--muted);text-decoration:none;padding:.22rem .5rem;border-radius:6px}
nav a.h3{padding-left:1.3rem;font-size:.78rem;display:none}
nav a.h3.show{display:block}
nav a.h2{font-weight:500;color:var(--ink);margin-top:.15rem}
#shade{position:fixed;inset:3.2rem 0 0 0;background:#0006;z-index:24;display:none}#shade.on{display:block}
nav a:hover{background:var(--panel);color:var(--ink)}
nav a.on{color:var(--accent);background:var(--panel);font-weight:600}
main{padding:2rem clamp(1rem,4vw,3.5rem) 6rem;min-width:0;overflow-wrap:anywhere}
body{overflow-x:clip}
main>*{max-width:var(--w)}
main>table,main>pre,main>div.tw{max-width:100%}
h1,h2,h3,h4{font-family:Inter,sans-serif;line-height:1.25;letter-spacing:-.01em}
h1{font-size:2.1rem;margin:.2rem 0 1rem}
h2{font-size:1.45rem;margin:3.2rem 0 1rem;padding-top:1rem;border-top:2px solid var(--line)}
h3{font-size:1.12rem;margin:2.2rem 0 .7rem;color:var(--accent)}
p,li{hyphens:auto}
strong{font-weight:600}
a{color:var(--accent2)}
a.cite{font:500 .72em Inter,sans-serif;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line);white-space:nowrap}
a.cite:hover{color:var(--accent2);border-bottom-color:var(--accent2)}
span.g{border-bottom:1.5px dotted var(--accent);cursor:help}
#tip{position:absolute;z-index:40;max-width:22rem;padding:.6rem .8rem;background:var(--ink);color:var(--bg);font:.82rem/1.5 Inter,sans-serif;border-radius:8px;box-shadow:0 6px 24px #0004;display:none}
#tip b{display:block;margin-bottom:.15rem;color:var(--accent)}
details{margin:1rem 0;border:1px solid var(--line);border-radius:10px;padding:.2rem 1rem}
details[open]{padding-bottom:1rem}
summary{cursor:pointer;padding:.6rem 0;font:600 .9rem Inter,sans-serif;color:var(--accent)}
p{margin:0 0 1.1rem}li{margin:.35rem 0}ul,ol{padding-left:1.4rem}
blockquote{margin:1.2rem 0;padding:.6rem 1.1rem;background:var(--quote);border-left:4px solid var(--accent);border-radius:0 8px 8px 0}
.tw{overflow-x:auto;margin:1.2rem 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem;line-height:1.5}
th,td{padding:.55rem .7rem;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{background:var(--panel);font:600 .8rem Inter,sans-serif;position:sticky;top:0}
tr:last-child td{border-bottom:0}
pre{background:var(--panel);padding:1rem;border-radius:10px;overflow-x:auto;font-size:.78rem;line-height:1.45}
code{font-size:.85em;background:var(--panel);padding:.1em .3em;border-radius:4px}
pre code{background:none;padding:0}
hr{border:0;border-top:1px dashed var(--line);margin:2.5rem 0}
mark{background:var(--hl);color:inherit;border-radius:2px}
li.task{list-style:none;margin-left:-1.3rem}
li.task input{margin-right:.5rem;transform:scale(1.15);accent-color:var(--accent)}
li.task.done{color:var(--muted);text-decoration:line-through}
#top{position:fixed;right:1.2rem;bottom:1.2rem;display:none}
#menu{display:none}
.hidden{display:none!important}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}main{padding:1.2rem 1.1rem 5rem}h1{font-size:1.6rem}h2{font-size:1.25rem}body{font-size:16px}#q{max-width:none;min-width:0}header .title span{display:none}th,td{padding:.45rem .5rem}nav{position:fixed;left:0;top:3.2rem;width:80vw;max-width:20rem;background:var(--bg);z-index:25;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px #0003}nav.open{transform:none}#menu{display:inline-block}header .title{font-size:.85rem}}
@media print{header,nav,#top,#bar{display:none!important}.wrap{display:block}body{font-size:11pt;background:#fff;color:#000}a.cite::after{content:""}h2{page-break-before:always}}
</style>
</head>
<body>
<div id="bar"></div>
<header>
  <button class="ic" id="menu" aria-label="Contents">☰</button>
  <div class="title">Basics of Ethics <span>· End-Sem Guide</span></div>
  <input id="q" type="search" placeholder="Search the guide (e.g. phronesis, Boisjoly)…" aria-label="Search">
  
  <button class="ic" id="theme" title="Toggle dark mode">◐</button>
</header>
<div class="wrap">
  <nav id="toc" aria-label="Contents"></nav>
  <main id="c">Loading…</main>
</div>
<div id="tip"></div>
<div id="shade"></div>
<button class="ic" id="top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Top</button>

<script>window.__MD="# Basics of Ethics: End-Semester Study Guide (Monsoon 2026)\n\nEverything here comes from the files in this folder. Each claim is cited so you can check it:\n\n- **L6\u2013L9** = lecture slide decks `BoE_06`\u2013`BoE_09`. `s12` means slide 12. *(L7's title slide says \"Lecture 6\" by mistake. I cite it as L7.)*\n- **Kant, LE p.x** = Kant, \"The Good Will and the Categorical Imperative\", in Shafer-Landau, *Living Ethics*, pp. 86\u201393.\n- **Aristotle, LE p.x** = Aristotle, *Nicomachean Ethics* Bk II, in *Living Ethics*, pp. 143\u2013150.\n- **vdP p.x** = van de Poel & Royakkers, *Ethics, Technology, and Engineering*, Ch. 1, \"The Responsibilities of Engineers\" (printed pages 7\u201330).\n- **L1\u2013L5** = lectures from before Quiz-1.\n\nText in quotation marks was checked word for word against the source PDFs. Text marked *(paraphrase)* is not a quotation, so don't put it in quote marks in the exam.\n\n## Start here: the whole course in plain words\n\n**What is ethics asking?** Two basic questions. *What should I do?* (right and wrong actions) and *What kind of life and person is good?* Philosophers answer them with **theories**: general principles that tell you how to decide any case, the way a formula solves any instance of a maths problem.\n\n**The three big theories on your syllabus**, using one example: *should I lie to a friend to spare their feelings?*\n\n- **Utilitarianism (Bentham, Mill; Lecture 6):** look at the **results**. Do whatever produces the most happiness overall. If the lie makes everyone happier, lie.\n- **Kant's ethics (Lecture 7):** look at the **rule you're acting on** and your **motive**. Ask whether everyone could act on that rule, and whether you're treating the other person as a thinking being who deserves respect. Deceiving your friend manipulates them, so don't lie, whatever the result.\n- **Aristotle's virtue ethics (Lecture 8):** look at your **character**. Ask what an honest, kind and sensible person would do. Probably tell the truth gently, choosing the right moment and words. There's no formula; it takes practical judgment.\n\n**Lecture 9 applies all this to engineers.** When something goes wrong (the Challenger shuttle exploded), *who is to blame, and why?* And before anything goes wrong, *what should a good engineer do?*\n\n**Reading tips:** a term with a dotted underline shows its meaning when you hover over it (tap on a phone). Every term is also listed in the Glossary just below. *Italic text in quotation marks* is a real quotation with its page; \"(paraphrase)\" means it's in my words, not the author's.\n\n## Glossary: every technical term in plain words\n\n<details>\n<summary><strong>Open the glossary<\/strong> (about 110 terms, A\u2013Z by topic)<\/summary>\n\n| Term | Meaning in plain words |\n|---|---|\n| normative | About what *ought* to be (values, rules), as opposed to *descriptive*, which is about what *is* the case (facts). |\n| meta-ethics | Questions *about* morality itself: what \"good\" means, and whether moral claims can be true. |\n| is\u2013ought gap | Hume's point that you can't logically get a conclusion about what *ought* to be from facts about what *is*. |\n| intrinsic good | Good in itself, for its own sake. |\n| instrumental good | Good because of what it leads to (e.g. money). |\n| theory of the good | A theory that first says what is valuable, then defines right action as whatever produces it. Consequentialism is the example. |\n| theory of the right | A theory where right action comes first and doesn't depend on results. Kant is the example. |\n| consequentialism | The view that an action is right only because of its consequences, if it produces the best overall results. The term was coined by Anscombe. |\n| optimific | Producing the best possible overall results. |\n| utilitarianism | Consequentialism where the good is happiness or well-being: \"the greatest good for the greatest number\". |\n| hedonism | The view that pleasure (and the absence of pain) is the only thing good in itself. |\n| desire-satisfaction theory | The view that what's good for you is getting what you desire. |\n| hedonic calculus | Bentham's method for adding up pleasures by intensity, duration, certainty, propinquity (how soon), fecundity (leads to more pleasure), purity (free of pain) and extent (how many people). |\n| higher pleasures | Mill: pleasures of the mind are better in *quality* than bodily pleasures, not just greater in quantity. |\n| act utilitarianism | Judge *each individual act* by whether it maximises overall well-being. |\n| rule utilitarianism | Follow the rules that would produce the best results *if everyone accepted them*, even when breaking one would help in a particular case. |\n| rule worship | Smart's criticism of rule utilitarianism: obeying a rule even when you know breaking it would do more good is irrational, like worshipping an idol. |\n| supererogation | Going beyond duty: good to do, but not wrong if you don't (e.g. heroism, charity). |\n| counterfactual | What *would* have happened if you had acted differently. |\n| impartiality | Counting everyone's interests equally, including strangers'. |\n| moral desert | What someone deserves (e.g. the innocent don't deserve punishment). |\n| effective altruism | A movement that uses utilitarian reasoning to do \"the most good\" with limited resources. |\n| longtermism | The view that we should focus on the very long-term future because most people who will ever live are yet to be born. |\n| deontology | A duty-based ethics (Greek *deon*, duty). Some acts are required or forbidden whatever their results. Kant's theory is the example. |\n| good will | For Kant, a will that does its duty *because* it is its duty. The only thing good without any condition. |\n| inclination | Desires and feelings (sympathy, fear, self-interest). For Kant they can't give an act moral worth. |\n| from duty | Doing the right thing *because it is right*. Only this has moral worth for Kant (contrast \"in conformity with duty\": doing it for profit or liking, like the honest shopkeeper). |\n| moral worth | The special value an act has when done from duty. |\n| maxim | The personal rule behind your action: what you're doing and why (e.g. \"I'll make a false promise to get money when I need it\"). |\n| hypothetical imperative | A conditional command: \"*if* you want X, do Y\". It binds you only if you want X. |\n| categorical imperative | An unconditional command: \"do Y\", whatever you want. Kant says all moral duties are like this. |\n| universalizability | Imagining your maxim as a rule *everyone* follows, and checking whether it still works. |\n| FUL | Formula of Universal Law, Kant's first test: act only on maxims you could will everyone to follow. |\n| FH | Formula of Humanity, Kant's second test: treat people always as ends, never *merely* as means. |\n| end in itself | Something valuable in itself; for Kant, every rational person. |\n| merely as a means | Using someone as a tool for your purpose in a way they couldn't agree to, e.g. by deceiving or coercing them. Using a shopkeeper's services with their agreement is fine. |\n| contradiction in conception | A maxim that couldn't even *exist* as a universal law (universal false promising destroys promising). It generates a perfect duty. |\n| contradiction in the will | A maxim that could exist universally but that you can't consistently *want* (a world where no one helps anyone). It generates an imperfect duty. |\n| perfect duty | A strict duty with no exceptions for inclination (don't make false promises). |\n| imperfect duty | A duty with leeway about when and how (develop your talents, help others sometimes). |\n| autonomy | Self-rule (Greek *autos*, self + *nomos*, law): the ability to give yourself moral laws by reason. |\n| Golden Rule | \"Do unto others as you'd have them do unto you.\" Kant's test is *not* this, because the Golden Rule depends on what you personally want. |\n| trolley problem | A runaway trolley will kill five people unless you divert it so it kills one. Introduced by Foot; named by Thomson. |\n| patient's dilemma | Should a surgeon kill one healthy visitor to use his organs to save five patients? |\n| Doctrine of Double Effect | It can be permissible to cause a harm you *foresee but don't intend* (a side effect), but not one you *intend* as your aim or means. |\n| DDE | Doctrine of Double Effect (see above). |\n| negative duties | Duties *not to harm*. Foot holds they are stronger than positive duties (duties *to help*). |\n| Knobe effect | People judge a *bad* side effect as intentional but a *good* one as unintentional, even when the agent's attitude is the same. |\n| virtue ethics | An ethics centred on *character*: become a good person, and good actions will follow. |\n| eudaimonia | Flourishing: living well and doing well over a whole life. More than feeling happy. |\n| function argument | Aristotle: a thing is good when it performs its function well. The human function is rational activity, so the good human life is reasoning and acting well. |\n| moral virtue | A virtue of character (courage, temperance, generosity), acquired by **habit**. |\n| intellectual virtue | A virtue of the mind (e.g. practical wisdom), acquired by **teaching** and experience. |\n| habituation | Becoming good by repeatedly *doing* good acts until they become second nature. |\n| state of character | A stable disposition to feel and act in certain ways. Aristotle's \"genus\" of virtue. |\n| genus and differentia | A method of defining: the general class something belongs to (genus) plus what makes it distinct within that class (differentia). |\n| mean relative to us | The right amount *for this person in this situation*, not a mathematical average (food for Milo the wrestler vs a beginner). |\n| phronesis | Practical wisdom: knowing how to act well in particular situations, learned through experience. It finds the mean. |\n| episteme | Scientific knowledge of what is necessary and unchanging. |\n| techne | Craft skill: knowing how to make things. |\n| nous | Intuitive grasp of first principles. |\n| sophia | Theoretical wisdom: nous combined with episteme. |\n| continence | Doing the right thing while still having strong contrary desires. Less than full virtue, because the virtuous person *enjoys* acting well. |\n| moral exemplar | A role model of virtue whom we learn from by imitation. |\n| particularist | Holding that ethics can't be reduced to exact universal rules, so each case needs judgment. |\n| priority problem | Is an act right *because* the virtuous person does it, or does the virtuous person do it *because* it's right? |\n| causal responsibility | Causing something (a faulty O-ring can), as opposed to being *morally* answerable for it (only agents can be). |\n| active responsibility | Forward-looking duty to make things go well *before* anything happens. |\n| passive responsibility | Backward-looking responsibility *after* something has gone wrong. |\n| accountability | Having to explain and justify your actions to those entitled to ask. |\n| blameworthiness | Properly deserving blame. Needs wrong-doing, causal contribution, foreseeability and freedom. |\n| liability | Legal responsibility: being sued or punished. |\n| causal contribution | Your act *or failure to act* was a necessary part of what caused the outcome. |\n| foreseeability | You could reasonably have known the harm might happen. |\n| ought implies can | You can only be obliged to do what you're actually able to do. |\n| role responsibility | Duties that come with a role (employee, engineer, parent). |\n| professional responsibility | Role responsibility as a professional, but only within what morality allows. |\n| prima facie | \"At first sight\". Ross's term for a duty that holds unless a stronger duty outweighs it. *Sans phrase* / \"all things considered\" is what you must do after weighing them. |\n| Bovens | Mark Bovens, who listed the five features of active responsibility: noticing threats to norms, considering consequences, autonomy, a consistent code, taking role obligations seriously. |\n| effectiveness | How far a goal is achieved. |\n| efficiency | Goal achieved per unit of effort. |\n| value-laden | Containing value choices, even when it looks like neutral fact. |\n| separatism | The view that engineers supply technical facts and managers or politicians make the value decisions. |\n| tripartite model | The picture behind separatism: politicians and managers set goals, engineers design, users use, and engineers are responsible only for the technical part. |\n| hired gun | An engineer who does any assigned task without moral concern (von Braun). |\n| technocracy | Rule by experts (engineers) instead of managers or elected politicians. |\n| technocratic fallacy | The mistake of thinking technical expertise also makes you an expert on *values* and goals. |\n| paternalism | Deciding for others \"for their own good\", overriding their right to choose. |\n| whistle-blowing | Disclosing wrongdoing in your organisation without your superiors' consent, to stop it or warn the public. |\n| stakeholders | People affected by a technology who may have no say in shaping it. |\n| Collingridge dilemma | Early on, a technology's effects can't be predicted. Later, when they're known, it's too entrenched to change. |\n| CTA | Constructive Technology Assessment: assessing a technology's social effects *during* development and feeding that back into design. |\n| cognitivism | The view that moral statements express beliefs, so they can be true or false. |\n| non-cognitivism | The view that moral statements express feelings or attitudes, so they can't be true or false. |\n| truth-apt | Capable of being true or false. |\n| emotivism | Moral statements just express feelings, like \"Boo, murder!\". |\n| error theory | Mackie: moral statements try to state facts, but there are no moral facts, so they're all false. |\n| argument from queerness | Mackie: objective values would be impossibly strange things, knowable only by some strange special faculty. |\n| descriptive relativism | The factual claim that cultures *differ* in their moral beliefs. |\n| ethical relativism | The claim that what is right *really depends* on culture; there are no universal moral truths. |\n| prescriptive relativism | The claim that we therefore *shouldn't judge* other cultures. |\n| moral isolationism | Midgley's name for the view that we may not morally judge cultures other than our own. |\n| ethical egoism | You ought always to do what is in your own long-term interest. |\n| Euthyphro | Plato's dialogue asking whether God commands things because they are right, or whether they are right because God commands them. |\n| experience machine | Nozick's thought experiment: would you plug into a machine that gives perfect but fake experiences? If not, pleasure isn't all that matters. |\n| zoon politikon | Aristotle: humans are \"political\" (social) animals who flourish in community. |\n| solipsistic | Self-enclosed, as if only you and your experiences exist. |\n| reductio ad absurdum | Disproving a claim by showing it leads to an absurd result. |\n| thought experiment | An imagined scenario used to test a theory (the trolley, the experience machine). |\n\n<\/details>\n\n\n---\n\n## Sources: open and check\n\nThe links open the file in the **private GitHub repo**, so you need to be logged in as the repo owner. Citations throughout the guide (e.g. *LE p.92*, *vdP p.11*, *L7 s13*) are clickable and open the right file. GitHub's PDF viewer can't jump to a page, so the page to scroll to is shown when you hover over the link and in the table below.\n\n| Source | File | Page conversion |\n|---|---|---|\n| Kant, \"The Good Will and the Categorical Imperative\" (*Groundwork*, trans. Gregor), in Shafer-Landau, *Living Ethics* pp. 86\u201393 | [open](https://github.com/nilavra17ghosh/Boe/blob/main/readings/Kant_Good_Will_and_Categorical_Imperative_LE_pp86-93.pdf) | LE p.N = excerpt page N \u2212 85 |\n| Aristotle, *Nicomachean Ethics* Bk II (trans. Ross), in *Living Ethics* pp. 143\u2013150 | [open](https://github.com/nilavra17ghosh/Boe/blob/main/readings/Aristotle_Nicomachean_Ethics_LE_pp143-150.pdf) | LE p.N = excerpt page N \u2212 142 |\n| Shafer-Landau, *Living Ethics* Ch. 10 \"Virtue Ethics\" (textbook commentary, pp. 134\u2013143) | [open](https://github.com/nilavra17ghosh/Boe/blob/main/readings/ShaferLandau_Ch10_Virtue_Ethics_LE_pp134-143.pdf) | LE p.N = excerpt page N \u2212 133 |\n| van de Poel & Royakkers, *Ethics, Technology, and Engineering* (2011), Ch. 1 | [open](https://github.com/nilavra17ghosh/Boe/blob/main/Chapter%201_The%20responsibilities%20of%20engineers%20%28from%20Ibo%20van%20de%20Poel%2C%20Lamb%C3%A8r%20Royakkers%20-%20Ethics%2C%20Technology%2C%20and%20Engineering%29.pdf) | vdP p.N = PDF page N \u2212 5 |\n| Shafer-Landau, *Living Ethics* (full book) | [open](https://github.com/nilavra17ghosh/Boe/blob/main/Russ%20Shafer-Landau_Living%20Ethics%20An%20Introduction%20with%20Readings.pdf) | LE p.N = PDF page N + 17 |\n\n**Lecture slides** (slide *sN* = PDF page N): [L1](https://github.com/nilavra17ghosh/Boe/blob/main/BoE_01_Introduction.pdf) \u00b7 [L2](https://github.com/nilavra17ghosh/Boe/blob/main/BoE_02_Cognitivism%2C%20Non-cognitivism%2C%20DCT.pdf) \u00b7 [L3](https://github.com/nilavra17ghosh/Boe/blob/main/BoE_03_Moral%20Skepticism.pdf) \u00b7 [L4](https://github.com/nilavra17ghosh/Boe/blob/main/BoE_04_Hedonism.pdf) \u00b7 [L5](https://github.com/nilavra17ghosh/Boe/blob/main/BoE_05_From%20hedonism%20to%20utilitarianism.pdf) \u00b7 [L6](https://github.com/nilavra17ghosh/Boe/blob/main/BoE_06_Utilitarianism_Act%20and%20Rule.pdf) \u00b7 [L7](https://github.com/nilavra17ghosh/Boe/blob/main/BoE_07_Kants%20deontological%20ethics%20and%20the%20trolley%20problem.pdf) \u00b7 [L8](https://github.com/nilavra17ghosh/Boe/blob/main/BoE_08_Aristotle%20and%20Virtue%20Ethics.pdf) \u00b7 [L9](https://github.com/nilavra17ghosh/Boe/blob/main/BoE_09_Ethics%2C%20Engineering%2C%20and%20Responsibility.pdf)\n\n**Exam papers:** [End-sem 2024 paper](https://github.com/nilavra17ghosh/Boe/blob/main/BOE/VijayrajS-iiitprevpapers/Year4/CS/BOE-Basics%20of%20Ethics/BoE_end_2024_M.pdf) \u00b7 [Quiz-1 2026 paper (photo)](https://github.com/nilavra17ghosh/Boe/blob/main/Quiz-1.jpeg) \u00b7 [**Quiz-1 2026 answer key**](https://github.com/nilavra17ghosh/Boe/blob/main/Quiz-1_answer%20key-1.pdf) \u00b7 [Quiz-1 2024 paper](https://github.com/nilavra17ghosh/Boe/blob/main/BOE/VijayrajS-iiitprevpapers/Year4/CS/BOE-Basics%20of%20Ethics/BoE_quiz1_2024_M.pdf) \u00b7 [Quiz-1 2024 key](https://github.com/nilavra17ghosh/Boe/blob/main/BOE/VijayrajS-iiitprevpapers/Year4/CS/BOE-Basics%20of%20Ethics/BoE_quiz1_2024_M_key.pdf) \u00b7 [Pop quiz 2024](https://github.com/nilavra17ghosh/Boe/blob/main/BOE/VijayrajS-iiitprevpapers/Year4/CS/BOE-Basics%20of%20Ethics/BoE_pop-quiz_2024_M_key.pdf) \u00b7 [End-sem syllabus notice](https://github.com/nilavra17ghosh/Boe/blob/main/Endsem.jpg)\n\n---\n\n---\n\n## PART 0: What the exam looks like and what the professor rewards\n\n### 0.1 Syllabus (professor's notice, 20 Nov 2026, `Endsem.jpg`)\n1. Kant, \"The Good Will and the Categorical Imperative\" (LE pp. 86\u201393), with the **L7** slides\n2. Aristotle, *Nicomachean Ethics* (LE pp. 143\u2013150), with the **L8** slides\n3. van de Poel & Royakkers, Ch. 1 \"The Responsibilities of Engineers\", with the **L9** slides\n4. **Plus:** *\"you may also be expected to connect these with the topics discussed prior to quiz-1.\"*\n\n**About Lecture 6 (Utilitarianism):** you listed it as core. The notice doesn't name a utilitarian reading, and Quiz-1 (24 Oct 2026) already tested act/rule utilitarianism (Q4) and Mill (Q3). Treat L6 as **essential connecting material**: Kant and Aristotle are defined largely *against* utilitarianism. It's unlikely to be the sole subject of a question. The 2024 end-sem did contain a pure pre-quiz question (Nozick's experience machine), though, so keep L4\u2013L6 warm.\n\n### 0.2 Format (inferred, not confirmed)\nYour course evaluation (L1 s20) says the end-sem is worth **30 marks**. The 2024 end-sem (`BoE_end_2024_M.pdf`) was **1.5 hours, answer any 3 of 5, 300\u2013400 words each, 3 \u00d7 10 marks.** Plan for that format. If the 2026 paper differs, the preparation still carries over.\n\n### 0.3 Instructions printed on past papers. Read these as the marking scheme\n> \"You will be evaluated on the basis of the **number of points you cover in response to each part of the question** and the **inferences you draw from these**, NOT on the basis of the number of words\u2026 keep your answers precise and to the point, **justifying your position wherever necessary**.\" (End-sem 2024)\n\nThe Quiz-1 2024 key (`BoE_quiz1_2024_M_key.pdf`) shows the marking: **1 mark per distinct point**, with phrasing such as \"look for any 2\". Implications:\n- **Questions come in several parts** (\"What is X? Distinguish X/Y. Describe the three\u2026 and the four\u2026\"). Each part carries marks. Answer each part under its own label.\n- **Enumerations score.** \"Three forms\", \"four conditions\", \"any 4 reasons\", \"five intellectual virtues\". Give the full list with one line explaining each item.\n- **A final evaluative part is common** (\"would you plug in?\", \"illustrate with a real-world example\"). Take a position and justify it. It's an easy mark people skip.\n- **Readings are tested by content, not citation.** No past question asked for a page number. Questions do ask for *the author's argument* (\"as it appears in the essay\u2026\", \"who is the author of this quote?\"). A short accurate quotation shows command of the text, and an accurate paraphrase scores the same point.\n\n### 0.4 Every past question, by type\n\n| Paper | Question | Type | Topic |\n|---|---|---|---|\n| End 2024 Q1 | What is moral responsibility; active vs passive; 3 forms of passive; 4 conditions | Conceptual + enumeration | **vdP / L9** |\n| End 2024 Q2 | Nozick's experience machine; intention; 4 reasons not to plug in; your choice | Reconstruction + evaluation | L4\u20135 (pre-quiz) |\n| End 2024 Q3 | Roles vs responsibilities; how a utilitarian / Kantian / virtue ethicist responds to moral vs professional conflict; real example | **Comparative + application** | **L9 \u00d7 L6/7/8** |\n| End 2024 Q4 | How virtue ethics works; what virtue is and how acquired; intellectual vs moral virtues and their relation | Conceptual + enumeration | **Aristotle / L8** |\n| End 2024 Q5 | Means vs end-in-itself with examples; how fairness, consistency, humanity figure in Kant | Conceptual + example | **Kant / L7** |\n| Quiz-1 2026 Q1 | Midgley's moral isolationism as the standard relativist argument; 2 flaws | Reading \u2192 argument form | L3 |\n| Quiz-1 2026 Q2 | Mackie's error theory vs emotivism; argument from queerness | Comparative + reading | L2\u20133 |\n| Quiz-1 2026 Q3 | Identify the Mill quote; 3 points of ethical significance | **Quote identification** | L5 |\n| Quiz-1 2026 Q4 | Patient's dilemma under act vs rule utilitarianism; one limitation each | Application + comparison | L6 |\n| Pop quiz 2024 | MCQs on Kant, util, trolley, DDE, Knobe, Bentham | Recall | L6\u20137 |\n\n### 0.5 What this year's Quiz-1 answer key shows (`Quiz-1_answer key-1.pdf`, 24 Oct 2026)\nThis is the most direct evidence of how the *current* examiner marks. Five rules follow from it:\n\n1. **Label + description.** Each point is split into **\u00bd mark for the correct technical label** and **1 mark for the description**. Example: \"*Metaphysical part* (label) \u2192 objective values would be entities 'utterly different from anything else in the universe' (description)\". **So always name the concept in bold, then explain it.** If you leave the label out, you lose half the point.\n2. **Map the reading onto the class framework.** Q1 gave marks for (a) the class label (descriptive / ethical / prescriptive relativism), (b) mapping each label onto Midgley's text (samurai sword \u2192 descriptive relativism, and so on), and (c) **1 mark for the correct order of the argument.** *\"A rough mapping should do.\"* For the end-sem, expect the same exercise with the new readings:\n   - **Kant:** map the **false-promise passage** (LE pp.88\u201389) onto the **three-part universalizability test** (L7 s13). Formulate the maxim \u2192 universalize it \u2192 the goal is defeated, because promising \"would have to destroy itself\". Or map the four examples onto FUL and then FH (LE pp.90\u201392).\n   - **Aristotle:** map Book II onto **genus \u2192 differentia \u2192 definition** (L8 s20\u201323). Or map \"we become just by doing just acts\" onto the **circularity puzzle \u2192 three conditions** (L8 s18\u201319).\n   - **van de Poel:** map **Challenger facts onto the four conditions** (L9 s16\u201320). Or map **Boisjoly / von Braun / Taylor / van Veen** onto **separatism / hired gun / technocracy / whistle-blowing** (vdP pp.21\u201324).\n3. **Quotation \u2192 identify author \u2192 give three points of significance** (Q3: 0.5 for the author, 1.5 per point). Candidates for the end-sem: Kant's \"jewel\" (LE p.87), the humanity formula (LE p.92), Aristotle's definition of virtue (LE p.147), \"neither by nature nor contrary to nature\" (LE p.144), \"we become just by doing just acts\" (LE p.144), Lehrer's von Braun lyric (vdP p.22). Have **three significance points ready for each** (see 9.2).\n4. **Cross-lecture links earn marks.** Q3's key gave a full 1.5 marks for linking Mill to **Nozick's experience machine**. A link between lectures counts as a point in its own right. Use the \"Recall\u2026\" links on L9 s19, s21, s25 (Bovens \u2194 util, Kant and virtue; freedom \u2194 ought implies can, hypothetical vs categorical).\n5. **Lenient on the verdict, strict on the basis.** Q4 accepted *any* rule-utilitarian verdict *\"as long as they note \u2026 a socially optimific rule\"*. The examiner rewards the **justifying principle**, not one particular answer. In application questions, **always state the principle that grounds your verdict.**\n\n**The ready-to-use list of limitations from the key** (also for Kant comparisons):\n- **AU:** needs knowledge of counterfactuals; no line between obligation and supererogation (too demanding); strict impartiality; no room for desert or rights.\n- **RU:** irrational rule-worship (Smart); collapses back into AU once exceptions are added.\n\n**How the professor sets questions:**\n1. **About one question per reading**, phrased in the slide-deck's own vocabulary (e.g., \"fairness, consistency, humanity\" is L7 s8, s13 and s14 word for word).\n2. **At least one cross-cutting question** that runs a case through all three normative theories (2024 Q3). With the syllabus now explicitly about *connecting* topics, expect this again.\n3. **Lists from slides and readings are asked back verbatim:** four conditions of blameworthiness, three forms of passive responsibility, five intellectual virtues, Bovens's five features.\n4. **Real-world examples are explicitly requested.** Use the course's own cases: Challenger, von Braun, Taylor, van Veen, Inez Austin, Teflon, Eichmann.\n5. **Pre-quiz material can appear directly** (2024 Q2), not only as background.\n\n---\n\n## PART 1: The framework you need first (from L4, L5, L7, L8)\n\nThe one structural idea that ties the course together (L4 s5\u20137; L7 s5; L8 s5; pop quiz Q1):\n\n| | **Theories of the Good** | **Theories of the Right** | **Virtue ethics** |\n|---|---|---|---|\n| What is evaluated | **Consequences** | **Motives / maxims** | **Character** |\n| Order of explanation | Good prior to right; right = whatever produces the good | Right prior to good; good = acting rightly from a good will | Right action = what the virtuous person would characteristically do |\n| Course examples | Hedonism (Epicurus), DST, utilitarianism (Bentham, Mill) | Kant's deontology | Aristotle; revival by Anscombe, Foot, Hursthouse, MacIntyre, Vallor |\n| Central question | What outcome is best? | What is my duty? Can my maxim be universalized? | What kind of person should I be? How should I live? |\n\nL4 s7 puts it as three \"levels of evaluation\": *of consequences, of motives, of character.* Use this phrasing in introductions.\n\n**Other prerequisite concepts that come back in the end-sem topics:**\n\n| Earlier concept (source) | Where it returns |\n|---|---|\n| **Ought implies can** (L1 s11; L2 s4; Quiz-1 2024) | L9 s19: the **freedom** condition of blameworthiness is \"ought implies can\" |\n| **Hypothetical vs categorical** \"oughts\" (L2 s3) | L7 s9 (Kant); L9 s19 says \"Recall hypothetical vs categorical imperatives\" about coercion and promotion threats |\n| **Intrinsic vs instrumental good** (L4 s9) | Kant: good will is the only *unconditional* good. Aristotle: virtues chosen \"for their own sakes\". L9 s24 asks whether technologies are intrinsically or instrumentally good |\n| **Is\u2013ought gap** (Hume, Moore, L1 s9) | vdP p.18: efficiency *looks* like neutral fact but is value-laden. Engineering = means, ethics = ends (L9 s26) |\n| **Experience machine / zoon politikon** (L4 s15\u201318) | Aristotle's eudaimonia is *activity* in contact with reality, not passive pleasure. Nozick's \"we want to *be* a certain sort of person\" is close to virtue ethics |\n| **Mill's higher pleasures, competent judges** (L5 s31\u201336) | Mill's competent judge resembles Aristotle's person of practical wisdom (both make the experienced, wise person the standard) |\n| **Autonomy argument against hedonism** (L4 s19) | Kant's autonomy (*autos + nomos*, L7 s15). vdP p.23: technocracy is wrong because it is paternalistic and violates moral autonomy |\n| **DCT and Euthyphro** (L2 s16\u201320) | Kant's moral law is self-given, not God-given (pop-quiz Q9: \"one's own will\") |\n| **Relativism** (L3) | Kant's universalizability is the opposite of relativism: valid for every rational being (pop-quiz Q3) |\n| **Mackie's argument from queerness** (L3 s18) | Mackie says intrinsically action-guiding properties would be \"queer\". Kant's categorical imperative claims there *are* reasons independent of desire (LE p.86 intro; LE p.93 study Q4) |\n| **Supererogation** (L6 s16, s21; Singer) | Kant's *imperfect* duties. vdP: is whistle-blowing a duty or heroic sacrifice? (p.25) |\n\n---\n\n## PART 2: Lecture 6, Utilitarianism (connecting material)\n\n### A. Core concepts\n- **Consequentialism:** an act is required *just because* it produces the best overall results (is **\"optimific\"**). The term was coined by **Anscombe**, \"Modern Moral Philosophy\" (1958) (L6 s5).\n- **Bentham:** quantitative hedonistic act-utilitarianism. Uses the **hedonic calculus** with seven dimensions: intensity, duration, certainty, propinquity, fecundity, purity, extent (L6 s8).\n- **Mill:** qualitative utilitarianism, with higher and lower pleasures (L6 s13; L5 s31\u201336).\n- **Act utilitarianism (AU):** intrinsic value is well-being, and the right act is whichever improves overall well-being (L6 s18).\n- **Rule utilitarianism (RU):** an act is right *because it is required by an optimific social rule*, i.e., a rule such that *if everyone in a society accepted it, the results would be optimific* (L6 s19; Brandt, Hooker). Pop-quiz Q2 tests the three-step RU test.\n\n### B. Arguments and objections\n- **Attractions of AU** (L6 s20): impartiality, justification, advocacy, moral flexibility, moral community.\n- **Difficulties** (L6 s12, s21):\n  1. **Quantification.** How do you add up pleasures? Marx called utilitarianism a philosophy for \"bean counters\".\n  2. **Foresight / counterfactuals.** You must predict the future (Manhattan Project).\n  3. **Over-demanding.** Singer erases the line between **supererogation** and **obligation**.\n  4. **Justice, desert, rights.** The **patient's dilemma** and the trolley.\n  5. **Decision procedure vs standard of rightness.** A defender can say AU is only a *standard*, not a method of deciding.\n  - It also justifies majoritarianism, slavery and torture (L6 s10).\n- **Smart's \"rule worship\" objection to RU** (L6 s22\u201325): RU either collapses into AU (once it allows exceptions) or becomes deontology in disguise. Smart asks: *\"is it not monstrous to suppose that if\u2026 we know that in this instance to break R will have better results than to keep it, we should nevertheless obey the rule? \u2026 Is not this a form of superstitious rule-worship\u2026?\"* (J.J.C. Smart, \"Extreme and Restricted Utilitarianism\", 1956, quoted L6 s25)\n- **Effective altruism and longtermism** (L6 s26\u201333): MacAskill; the Gebru & Torres \"TESCREAL\" critique. Counterpoints from Hoole: Ida Scudder and CMC Vellore show value \"beyond calculation\", and altruism can \"distort community\".\n\n### C. Quotations\n- Bentham: *\"Nature has placed mankind under the governance of two sovereign masters, pain and pleasure. It is for them alone to point out what we ought to do, as well as to determine what we shall do.\"* (*Introduction to the Principles of Morals and Legislation*, 1780, as quoted on L6 s7.) Pop-quiz Q20 tests this.\n- Mill: *\"It is better to be a human being dissatisfied than a pig satisfied; better to be Socrates dissatisfied than a fool satisfied.\"* (*Utilitarianism*, 1863, L6 s13 / L5 s34)\n- Singer: *\"we ought to give the money away, and it is wrong not to do so.\"* (\"Famine, Affluence, and Morality\", 1971, L6 s16)\n\n### D. Why you need this for the end-sem\nEvery Kant and Aristotle answer is stronger with a one-line contrast to utilitarianism:\n- **Kant:** consequences don't make an act right. Even the **patient's dilemma** is answered by the humanity formula: the healthy man is being used *merely as a means*.\n- **Aristotle:** virtue is not a calculation. *\"Matters concerned with conduct\u2026 have no fixity\"*, so no algorithm like the hedonic calculus can replace phronesis.\n- **Engineering (L9):** Bovens's \"consideration of the consequences\" and the human-welfare ideal are explicitly labelled \"Recall consequentialism / utilitarianism\" (L9 s21, s25).\n\n---\n\n## PART 3: Lecture 7, Kant's Deontology (with reading LE pp. 86\u201393)\n\n### A. Conceptual understanding, step by step\n\n**1. A theory of the right.** Right comes before good. Kant judges an act by its **motive and maxim**, not its results (L7 s5\u20136). *Deontology* comes from *deon*, duty: \"duty-based\" (L7 s8).\n\n**2. The good will** is the only thing good *without limitation* (Kant, LE p.86). Talents of mind (understanding, wit, judgment), temperament (courage, resolution) and gifts of fortune (power, riches, honour, health, even *happiness*) can all become *\"extremely evil and harmful\"* without a good will. Kant's example: *\"the coolness of a scoundrel makes him not only far more dangerous but also immediately more abominable\"* (LE p.87). This is a direct attack on hedonism: happiness is **not** always good (LE p.93, study Q2).\n\n**3. Results don't add to the good will's worth.** Even if it achieves nothing, *\"like a jewel, it would still shine by itself, as something that has its full worth in itself. Usefulness or fruitlessness can neither add anything to this worth nor take anything away from it.\"* (LE p.87)\n\n**4. Acting *from* duty vs acting *in conformity with* duty.** Only the first has moral worth (LE pp.87\u201388; L7 s21). Kant's four cases:\n\n| Case (LE pp. 87\u201388) | Conforms to duty? | Done from duty? | Moral worth? |\n|---|---|---|---|\n| **Shopkeeper** who doesn't overcharge a child, because *\"his advantage required it\"* | Yes | No, self-interest | **No** |\n| Ordinary person preserving their life out of inclination | Yes | No | **No** (*\"no inner worth\"*) |\n| Despairing man who *\"preserves his life without loving it\u2026 from duty\"* | Yes | Yes | **Yes** |\n| Naturally sympathetic **philanthropist** | Yes | No, inclination | **No** (\"deserves praise and encouragement but not esteem\") |\n| The same philanthropist, grief-stricken, who helps *\"simply from duty\"* | Yes | Yes | **Yes**, *\"then the action first has its genuine moral worth\"* |\n\n**5. A maxim** is *\"the subjective principle of acting\"*: the rule I actually act on. It differs from the objective practical *law* that holds for every rational being (Kant's footnote 1, LE p.90). The slides add: *\"It states what you are about to do and why you are about to do it\"* (L7 s12).\n\n**6. Hypothetical vs categorical imperatives** (LE p.89; L7 s9):\n- **Hypothetical:** \"If you want X, do Y.\" It binds only if you want X. In Kant's words it presents an action *\"as a means to achieving something else that one wills.\"*\n- **Categorical:** commands *\"an action as objectively necessary of itself, without reference to another end.\"* **Moral duties are categorical** (pop-quiz Q7). *\"Cheating is wrong\"* is categorical; *\"if you don't want to get caught, don't cheat\"* is hypothetical (pop-quiz Q16).\n\n**7. Formula of Universal Law (FUL).** *\"act only in accordance with that maxim through which you can at the same time will that it become a universal law.\"* (LE p.90). The law-of-nature version: *\"act as if the maxim of your action were to become by your will a universal law of nature.\"* (LE p.90)\n\n**The three-part test** (L7 s13):\n1. Formulate the maxim clearly.\n2. Imagine a world where everyone acts on it.\n3. Ask whether your goal can still be achieved in that world.\n\n**8. Fairness and consistency** (L7 s8, s13; pop-quiz Q5: *\"consistency and fairness\"* are the two criteria of universalizability):\n- **Fairness:** you make no exception for yourself. Kant: *\"we take the liberty of making an exception to it for ourselves (or just for this once)\"* (LE p.91). L7 s8 calls it unfair *\"that one is getting away with making an exception to the rule while expecting others to adhere to it.\"*\n- **Consistency:** your goal must stay achievable when everyone acts on the same maxim. Universal tax-cheating, plagiarism or infidelity would make welfare, assessment and marriage meaningless (L7 s8).\n- **Therefore:** *\"immoral conduct is irrational!\"* (L7 s13, s17).\n\n**9. Kant's four examples** (LE pp. 90\u201392). Know these and which test each one fails:\n\n| Example | Type of duty | FUL verdict (LE pp. 90\u201391) | FH verdict (LE p. 92) |\n|---|---|---|---|\n| 1. **Suicide** from self-love | Perfect, to oneself | A nature that destroys life through the very feeling meant to preserve it *\"would contradict itself\"* | Uses one's own person *\"merely as a means to maintain a tolerable condition\"* |\n| 2. **False promise** to borrow money | Perfect, to others | Universalized, it makes *\"the promise\u2026 itself impossible, since no one would believe what was promised\"*. Contradiction **in conception** | The lender *\"cannot possibly agree to my way of behaving toward him\"* |\n| 3. **Neglecting talents** (the \"South Sea Islanders\" example) | Imperfect, to oneself | Such a world *could* exist, but a rational being *\"cannot possibly will\"* it. Contradiction **in the will** | Fails to *further* humanity's predispositions to perfection |\n| 4. **Refusing to help** others (\"what is it to me?\") | Imperfect, to others | The world could exist, but *\"a will that decided this would conflict with itself\"*, because you'll need help yourself | Only *\"negative\"* agreement with humanity: you must *\"further the ends of others\"* |\n\n*Kant's footnote 2 (LE p.90): \"a perfect duty [is] one that admits no exception in favor of inclination.\"* The labels \"contradiction in conception\" and \"contradiction in will\" are standard terms for this distinction. The reading itself says \"could not even be thought\" vs \"impossible to will\" (*paraphrase*). Use the labels as interpretation, not as Kant's own words.\n\n**10. Formula of Humanity (FH).** *\"So act that you use humanity, whether in your own person or in the person of any other, always at the same time as an end, never merely as a means.\"* (LE p.92)\n- **Why it's needed** (L7 s14): the slides note FUL is *\"compatible with slavery or tyranny of the majority\"*, so the humanity principle is added as *\"a further condition\"*.\n- **Ground:** *\"rational beings are called **persons** because their nature already marks them out as an end in itself\"*. Non-rational beings *\"have only a relative worth, as means, and are therefore called **things**\"* (LE p.91).\n- **\"Merely\":** Kant does not forbid all use of others. I use a bus driver as a means to get home, but I don't treat them *merely* as a means, because they consent to the arrangement and could share its end. The test is whether the other person *\"could possibly agree\"* and *\"contain in himself the end\"* of my action (LE p.92).\n\n**11. Autonomy** (L7 s15): we are ends because we can, by reason, *create our own ends* instead of just following instinct. *Autos* (self) + *nomos* (law) means **self-legislators**. Pop-quiz Q9: the moral law is given *by one's own will*, not by society, God or nature.\n\n**12. FUL and FH are two expressions of one principle** (L7 s16): following universalizability *implies* treating people as autonomous ends.\n\n### B. Kant and the trolley problem (L7 s19\u201331)\n- **Intended vs merely foreseen effects:** we do *x* while intending *y*. Examples: splashing pedestrians while driving through a puddle; Jevons paradox; facial recognition replicating bias (L7 s19\u201320).\n- **The Knobe effect** (L7 s22\u201324; pop-quiz Q17): people judge a *bad* side effect to be brought about *intentionally*, and a *good* side effect *not* intentionally, even though the chairman's state of mind is the same in both cases.\n- **Doctrine of Double Effect (DDE):** *\"it is sometimes permissible to bring about by oblique intention what one may not directly intend\"* (Foot, as quoted on L7 s30). It is built into law (murder vs manslaughter), medicine and the rules of war.\n- **Trolley vs patient's dilemma** (pop-quiz Q12):\n  - AU sees no difference.\n  - In the trolley case you **foresee** but don't intend the death of the one. In the hospital case you **intend** the healthy patient's death.\n  - On Kantian grounds (the pop-quiz key's answer), both are wrongful.\n- **Foot's alternative: negative vs positive duties** (L7 s31):\n  - Negative duties: not to harm. Positive duties: to help. **Negative duties outweigh positive ones.**\n  - In the trolley case you redirect an *existing* threat. In the hospital case you *introduce* a new one.\n- **Pioneers** (L7 s26): **Foot** introduced the trolley in 1967 (pop-quiz Q14). **Anscombe** coined \"consequentialism\" in 1958. **Judith Jarvis Thomson** named \"the trolley problem\" and added the fat man.\n\n### C. Objections to Kant (L7 s32\u201333; LE p.93 study questions)\n1. **Are we as free and autonomous as Kant thinks?** Psychological and social constraints (compare vdP's freedom condition).\n2. **Animals.** On FH, non-rational beings are \"things\", so Kant seems unable to explain why cruelty to animals is wrong. Utilitarians (Bentham's \"extent\", Singer) can.\n3. **Severe consequences.** Indifference to results can be monstrous (e.g., refusing to lie to save a life). Kant also justifies capital punishment.\n4. **Perfect duties are exceptionless,** so what happens when duties conflict? (W.D. Ross's *prima facie* duties, L9 s12, are the classic fix.)\n5. **\"The functionalism of duty.\"** *\"Would you rather have someone do something out of excitement and willingness, or just out of duty?\"* (L7 s32). Kant seems to rank the cold dutiful man above the warm philanthropist. This is a key **Aristotle vs Kant** contrast: Aristotle says the virtuous person *delights* in acting well (LE p.144\u2013145).\n6. **The test lets some cases through wrongly** (LE p.93 Q5): trivial maxims fail (\"I'll play tennis Sunday mornings when the courts are empty\") and immoral ones pass if worded narrowly enough. *(These examples are standard illustrations of the objection, not from the slides.)*\n7. **AI and robots** (L7 s21, s33): machines have *functions* but do they have *intentions*? Can they act \"from duty\"? If robots became rational and autonomous, could we still treat them as mere means?\n\n### D. Reading guide: Kant, LE pp. 86\u201393\n- **Thesis:** morality rests on **reason, not consequences or inclination.** The only unconditional good is a good will acting from duty. Duty's supreme principle is the categorical imperative, in two formulations (FUL and FH).\n- **Its structure:** good will (p.86\u201387) \u2192 duty vs inclination (pp.87\u201388) \u2192 the law that a good will follows: universal conformity (p.88) \u2192 false-promise test (pp.88\u201389) \u2192 hypothetical vs categorical (p.89) \u2192 FUL and four examples (pp.90\u201391) \u2192 persons vs things (p.91) \u2192 FH and the same four examples (p.92).\n- **Where to use it:** every Kant answer; any \"why not utilitarianism\" point; any \"is happiness always good\" point; moral vs professional conflict (Boisjoly's duty not to deceive).\n\n---\n\n## PART 4: Lecture 8, Aristotle and Virtue Ethics (with reading LE pp. 143\u2013150)\n\n### A. Conceptual understanding\n**1. The question changes.** Virtue ethics shifts from \"what is right or wrong?\" to **\"how ought we to live our lives?\"** We don't get right action by calculating or rule-checking. We get it by **becoming the right kind of person**: *\"Try to become a virtuous person, and good actions will follow.\"* (L8 s6). The person is evaluated, not the isolated act (L8 s10).\n\n**2. Three components:** virtue, practical wisdom, eudaimonia (L8 s8).\n\n**3. Eudaimonia and the function argument** (L8 s9):\n- *Eudaimonia* is best translated **\"flourishing\"**: flourishing *in and through life*, not mere pleasure or success in one area.\n- A thing's good lies in fulfilling its **function** (ergon): the knife's function is to cut, the carpenter's to make lasting furniture.\n- The human function is **rationality**. Humans are *rational animals*.\n- The reading makes the same link: *\"every virtue or excellence both brings into good condition the thing of which it is the excellence and makes the work of that thing be done well; e.g. the excellence of the eye\u2026\"* So human virtue is *\"the state of character which makes a man good and which makes him do his own work well.\"* (LE p.146)\n\n**4. Two kinds of virtue: how each is acquired** (LE p.144; L8 s12). **This was 2024 Q4.**\n> *\"intellectual virtue in the main owes both its birth and its growth to **teaching** (for which reason it requires experience and time), while moral virtue comes about as a result of **habit**\"* (LE p.144). The Greek *\u0113thik\u0113* (moral) is a slight variation of *ethos* (habit). *(The Greek words are lost in this PDF. The derivation from \"habit\" is in the text.)*\n\n**5. Virtue is neither natural nor contrary to nature.** A stone thrown up *\"ten thousand times\"* can't be habituated to rise. *\"Neither by nature, then, nor contrary to nature do the virtues arise in us; rather we are adapted by nature to receive them, and are made perfect by habit.\"* (LE p.144)\n\n**6. Learning by doing (the analogy with the arts).** With natural capacities like sight, we have the capacity first and use it later. Virtues and arts are the reverse: *\"we get by first exercising them\u2026 men become builders by building and lyre-players by playing the lyre; so too we become just by doing just acts, temperate by doing temperate acts, brave by doing brave acts.\"* (LE p.144)\n\n**7. Ethics is practical and inexact.** *\"we are inquiring not in order to know what virtue is, but in order to become good\"* (LE p.144). *\"matters concerned with conduct and questions of what is good for us have no fixity, any more than matters of health\u2026 the agents themselves must in each case consider what is appropriate to the occasion, as happens also in the art of medicine or of navigation.\"* (LE p.144). The slides call this **particularist, contextual, situation-relative** ethics (L8 s14). It is the opposite of Kant's universal law and Bentham's calculus.\n\n**8. The health and strength analogy, and the virtuous cycle.** Too much or too little exercise and food destroys strength and health. In the same way, *\"the man who flies from and fears everything\u2026 becomes a coward, and the man who fears nothing at all\u2026 becomes rash\"* (LE p.144). Virtues are **preserved by the mean.** And the cycle reinforces itself: *\"by abstaining from pleasures we become temperate, and it is when we have become so that we are most able to abstain from them\"* (LE p.145; L8 s16).\n\n**9. Pleasure as the sign of character.** *\"the man who abstains from bodily pleasures and delights in this very fact is temperate, while the man who is annoyed at it is self-indulgent\"* (LE p.144). Hence moral education: *\"we ought to have been brought up in a particular way from our very youth, as Plato says, so as both to delight in and to be pained by the things that we ought; this is the right education.\"* (LE p.145)\n- **Contrast with Kant:** for Kant, acting *against* inclination shows moral worth. For Aristotle, acting well *while still pained* shows you aren't yet fully virtuous. Shafer-Landau calls that state *continence* (LE p.142\u2013143, \"Essential Concepts\").\n\n**10. The circularity puzzle and the three conditions of virtuous action** (LE pp.145\u2013146; L8 s18\u201319).\n- **The puzzle:** if we become just by doing just acts, aren't we already just?\n- **The answer:** the arts and the virtues differ. In art, the *product* carries the goodness. With virtue, the *agent* must be in a certain condition:\n  1. **Knowledge.** *\"he must have knowledge\"*\n  2. **Choice.** *\"he must choose the acts, and choose them for their own sakes\"*\n  3. **Firm character.** *\"his action must proceed from a firm and unchangeable character\"* (LE pp.145\u2013146)\n- Then: *\"it is not the man who does these that is just and temperate, but the man who also does them as just and temperate men do them.\"* (LE p.146). The slides (L8 s18\u201319) mark this \"Against consequentialism?\", because the same outward act can be virtuous or not depending on the agent.\n\n**11. The definition of virtue: genus and differentia** (LE pp.146\u2013147; L8 s20\u201323):\n- **Genus.** The soul contains *passions, faculties, states of character* (LE p.146). Virtue is **not a passion**: we aren't praised or blamed for feeling anger, passions involve no choice, and we are \"moved\" by passions but \"disposed\" by virtues. Virtue is **not a faculty**: faculties come by nature. So virtue is a **state of character** (*hexis*).\n- **Differentia.** It is a disposition to choose **the mean**.\n- **Mean in the object vs relative to us:** the arithmetic mean of 10 and 2 is 6. But a trainer won't prescribe 6 pounds of food to everyone, because that is *\"too little for Milo, too much for the beginner\"* (LE p.147).\n- The mean is to feel and act *\"at the right times, with reference to the right objects, towards the right people, with the right motive, and in the right way\"* (LE p.147).\n- *\"men are good in but one way, but bad in many.\"* (LE p.147)\n\n> **THE DEFINITION. Memorise it word for word:** *\"Virtue, then, is a state of character concerned with choice, lying in a mean, i.e. the mean relative to us, this being determined by a rational principle, and by that principle by which the man of practical wisdom would determine it.\"* (LE p.147; L8 s23)\n\nThe definition holds the whole theory: *state of character* (genus), *choice* (prohairesis), *mean relative to us* (particularism), *rational principle* (the human function), *man of practical wisdom* (phronesis and the moral exemplar). Unpack it clause by clause in any virtue answer.\n\n**12. Not everything has a mean** (LE p.147; L8 s24, labelled \"Reductio ad absurdum\"). Spite, shamelessness, envy, adultery, theft and murder are bad by name. *\"however they are done they are wrong; for in general there is neither a mean of excess and deficiency, nor excess and deficiency of a mean.\"* This answers the objection that the doctrine of the mean permits \"moderate murder\".\n\n**13. Table of virtues** (LE p.148; L8 s25):\n\n| Sphere | Deficiency | **Mean** | Excess |\n|---|---|---|---|\n| Fear and confidence | Cowardice | **Courage** | Rashness |\n| Bodily pleasures | Insensibility | **Temperance** | Self-indulgence |\n| Giving and taking money (small sums) | Meanness | **Liberality** | Prodigality |\n| Money (large sums) | Niggardliness | **Magnificence** | Tastelessness / vulgarity |\n| Great honour | Undue humility | **Proper pride** | Empty vanity |\n| Small honour | Unambitiousness | (nameless) | Ambition |\n| Anger | Unirascibility | **Good temper** | Irascibility |\n\n*Note: the L8 s10 list (modesty between shamelessness and bashfulness; temperance between \"excess and abstinence\") uses looser labels than the reading. In the exam, prefer the reading's terms.*\n\n**14. How the extremes relate** (LE pp.148\u2013149; L8 s26):\n- The brave person *looks* rash to the coward and cowardly to the rash person.\n- The extremes are more opposed to each other than to the mean.\n- Sometimes one extreme is \"more opposed\" to the mean, for two reasons: because of the thing itself (rashness resembles courage more than cowardice does), and because of ourselves (we naturally lean toward pleasure, so self-indulgence is the bigger enemy of temperance).\n\n**15. Practical advice for hitting the mean** (LE pp.149\u2013150):\n- *\"anyone can get angry\u2014that is easy\u2026 but to do this to the right person, to the right extent, at the right time, with the right motive, and in the right way, that is not for everyone, nor is it easy\"*\n- Move away from the more opposed extreme (Calypso: *\"Hold the ship out beyond that surf and spray\"*). As a second best, *\"take the least of the evils\"*.\n- Pull yourself toward the opposite of your own tendency, *\"as people do in straightening sticks that are bent\"*.\n- Guard against pleasure.\n- In the end, *\"the decision rests with perception\"* (LE p.150), not with a rule.\n\n**16. Practical wisdom (phronesis)** (L8 s11, s14, s27):\n- It is *know-how* for acting so that the virtue is accomplished. It is gained through *life experience*.\n- It can even require lying in a given situation (L8 s11). That contrasts sharply with Kant's exceptionless perfect duties.\n- **The mean is not mediocrity:** *\"'the mean' refers not to the mediocre or to the average but to the peak of excellence that is just right\"* (L8 s27). As Aristotle says, *\"with regard to what is best and right an extreme\"* (LE p.147).\n\n**17. The five intellectual virtues** (L8 s28). These are asked as a list:\n1. **Episteme** (science): demonstrative knowledge of the necessary and eternal; links effects to causes.\n2. **Techne** (art): knowing how to make or do things.\n3. **Phronesis** (prudence or practical wisdom): knowing how to *act*, how to secure the ends of human life.\n4. **Nous** (intuition or understanding): grasping the first principles from which demonstrations proceed.\n5. **Sophia** (wisdom): nous and episteme combined.\n\n**18. How intellectual and moral virtue relate** (L8 s27). This is the second half of 2024 Q4:\n- Moral virtue is the *mean determined by a rational principle\u2026 as the man of practical wisdom would determine it*. So **moral virtue depends on phronesis**, an intellectual virtue. *\"The intellectual virtue of prudence\u2026 is crucial to the acquisition of moral virtues\"* (L8 s27).\n- The dependence runs the other way too: phronesis develops only through habituated experience of acting well. Moral virtue gets the *end* right, and phronesis finds the right *means in the situation*. *(The two-way dependence is a standard reading of Aristotle, consistent with L8 s11 and s27. The excerpt does not develop it.)*\n- **Prudence** is also one of the four **cardinal virtues**, along with courage, temperance and justice (L8 s27).\n\n**19. Moral exemplars** (L8 s29\u201332): we learn virtue by emulating admirable people. Examples:\n- Odysseus as an all-round excellent person (*aret\u0113*, Kitto)\n- Vitruvius's educated architect\n- Heinlein's *\"Specialization is for insects.\"*\n\nThese connect to engineering: the ideal engineer should be more than a technician (compare L9's critique of separatism).\n\n**20. The modern revival** (L8 s7):\n- **Anscombe** (1958): we need an account of *what a virtue is* before we speak of justice.\n- **Foot:** the centrality of human well-being.\n- **MacIntyre**, *After Virtue* (1981).\n- **Hursthouse:** *\"An action is right iff it is what a virtuous agent would characteristically do in the circumstances\"* (*On Virtue Ethics*, 1999, quoted L8 s7).\n- **Vallor:** *Technology and the Virtues* (2016).\n\n### B. Objections and replies (Shafer-Landau Ch.10, LE pp.139\u2013143; L8 slides)\n1. **Inadequate guidance / conflict of virtues.** Honesty says tell your friend about her husband, but being a busybody is a vice. Virtue ethicists offer *\"very little instruction\"* for resolving this (Shafer-Landau, LE p.140). **Reply:** that is the point of phronesis and the inexactness thesis (LE p.144).\n2. **Who are the exemplars?** Shafer-Landau's example: Churchill's racism kept him from recognising Gandhi as an exemplar (LE p.140).\n3. **The priority problem.** Are acts right *because* the virtuous do them, or do the virtuous do them *because* they're right? This is a **Euthyphro-style dilemma** (compare L2 s17\u201320). Shafer-Landau calls it the theory's *\"greatest\"* vulnerability (LE p.142\u2013143).\n4. **Circularity** (Aristotle's own puzzle). Answered by the three conditions (LE pp.145\u2013146).\n5. **Doctrine of the mean as moderation.** Answered by \"mean relative to us\" and by \"no mean of murder\".\n\n### C. Reading guide: Aristotle, LE pp. 143\u2013150 (*NE* Bk II, trans. Ross)\n- **Thesis:** moral virtue is a **state of character, acquired by habituation, concerned with choice, consisting in a mean relative to us as determined by practical wisdom.** Ethics aims at *becoming good*, not theorizing.\n- **Order of the excerpt:** how virtue is acquired (habit, not nature) \u2192 ethics is inexact \u2192 excess, defect and the mean \u2192 pleasure and pain as signs, and education \u2192 the three conditions \u2192 genus (state of character) \u2192 differentia (mean) \u2192 the definition \u2192 things with no mean \u2192 the table \u2192 opposition of extremes \u2192 practical advice.\n\n---\n\n## PART 5: Lecture 9, Ethics, Engineering, and Responsibility (with reading vdP Ch.1)\n\n### A. Concepts\n**1. Responsibility** means *\"being held accountable for your actions and for the effects of your actions.\"* Failing to act also counts: *\"Failing to save a child who is drowning is therefore also a type of action.\"* (vdP p.9). The L9 s10 definition: the person is *\"subject to responses such as blame, praise, punishment, or reward\"*.\n\n**2. Causal vs moral responsibility** (L9 s5): an O-ring, an algorithm or a self-driving car can be a *cause* without being *morally* responsible. **AI angle:** does a machine meet the knowledge and freedom conditions? Compare L7 s21: machines have functions, but do they have intentions?\n\n**3. Active vs passive responsibility** (vdP p.9; L9 s11):\n- **Active (forward-looking):** *\"responsibility before something has happened. It refers to a duty or task to care for certain state-of-affairs or persons.\"* It is *\"not primarily about blame but requires a certain positive attitude or character trait\u2026 Philosophers call such positive attitudes or character traits virtues\"* (vdP p.13). That is a direct bridge to Aristotle.\n- **Passive (backward-looking):** *\"applicable after something (undesirable) has happened\"* (vdP p.9).\n\n**4. The three forms of passive responsibility** (vdP pp.10\u201311; L9 s15):\n1. **Accountability:** being held to account for, or having to justify, one's actions towards those entitled to demand it. Example: *\"NASA had to be able to render account\u2026 to the families of the victims, to society, and to the sitting judge\"* (vdP p.11).\n2. **Blameworthiness:** being *\"a proper target of blame\"* for one's actions or their consequences.\n3. **Liability:** legal responsibility, such as damages or punishment (L9 s15: \"Legal action\").\n\n*Relationship (vdP p.28):* *\"If you are not able to give a satisfactory account you are blameworthy.\"* Accountability leads to blameworthiness when the account fails.\n\n**5. Four conditions of blameworthiness** (vdP pp.11\u201313; L9 s16\u201320). **This was 2024 Q1.** *\"The extent to which you can be blamed is determined by the degree to which these conditions are fulfilled\"* (vdP p.11). So **blame comes in degrees**. Say this.\n\n| Condition | Meaning (vdP) | Challenger application (vdP pp.11\u201313) | Link to earlier lectures |\n|---|---|---|---|\n| **Wrong-doing** | Violating a norm (legal, organisational, or *moral*) | NASA reversed the **burden of proof**: it demanded proof the launch was *unsafe*, though its own policy required proof that it was *safe* | Needs an ethical framework to supply the norm: Kant, utilitarianism or virtue ethics (vdP p.11, L9 s16) |\n| **Causal contribution** | A necessary contribution to the outcome. **Failing to act counts too.** Usually not sufficient by itself | Both NASA's project team and Thiokol management had to give a positive decision, and either could have stopped it. Boisjoly could perhaps have gone to the press or intervened earlier | Act vs omission; Singer's pond |\n| **Foreseeability** | Could reasonably have known the consequences. Not blamed if *\"totally unreasonable to expect\"* awareness (vdP p.12) | All parties knew O-ring erosion was a risk at low temperatures. There was no conclusive proof, but enough to foresee danger | Utilitarian foresight problem (L6 s12). Collingridge dilemma (L9 s31) |\n| **Freedom** | Not acting under compulsion. Pressure **reduces** responsibility but doesn't **remove** it | Pressures: schedule, the public interest in McAuliffe, Thiokol's contract, Boisjoly's job. *\"probably not strong enough\"* to remove freedom, though Boisjoly's responsibility is arguably *diminished* (vdP pp.12\u201313) | **Ought implies can** (L9 s19; L1\u20132). Hypothetical vs categorical imperatives (L9 s19) |\n\n**6. Roles and responsibilities** (vdP pp.9\u201310; L9 s12\u201314). **This was 2024 Q3, first part.**\n- **Role responsibility:** *\"Each role brings with it certain responsibilities\"* (vdP p.9). Roles include friend, parent, citizen, employee, engineer, expert and colleague.\n- Roles can be **formal** (laid down in law, contracts, professional codes) or **informal** (family, friends) (vdP p.10; L9 s13).\n- **Role conflict:** Boisjoly was both an **employee** (expected to be loyal to his superiors) and an **engineer** (expected to give technically sound, safety-minded advice) (vdP p.10).\n- **Moral responsibility** *\"is based on moral obligations, moral norms, or moral duties\"*. It **can extend beyond roles** (Boisjoly's care for the astronauts) and **can limit roles** (*\"Think of the role of Mafioso\"*) (vdP p.10).\n- **Professional responsibility** is *\"based on one's role as professional in as far it stays within the limits of what is morally allowed\"* (vdP p.10). So morality bounds professional role. That is the key inference for 2024 Q3.\n- L9 s12 adds **W.D. Ross: *prima facie* duties vs duties all things considered** (*sans phrase*). A role gives *prima facie* duties. When they conflict, you must judge what is right *all things considered*.\n\n**7. Bovens's five features of active responsibility** (vdP p.13; L9 s21). The slides attach a theory to each:\n\n| Bovens feature | L9 s21 says \"Recall\u2026\" |\n|---|---|\n| Adequate perception of threatened violations of norms | Virtue ethics (perception and phronesis) |\n| Consideration of the consequences | Consequentialism |\n| Autonomy: making one's own independent moral decisions | (Kant, autonomy) |\n| Conduct based on a verifiable and consistent code | Kantian deontology |\n| Taking role obligations seriously | Aristotle's virtue ethics |\n\n**These five features give you a ready-made way to link all three theories inside an engineering answer.**\n\n**8. Ideals of engineers** (vdP pp.13\u201321). *Ideals* are *\"particularly motivating and inspiring\"* and aim at *\"an optimum or maximum\"* (vdP p.13).\n\n| Ideal | Content | Moral status (vdP) | Course example |\n|---|---|---|---|\n| **Technological enthusiasm** | Developing new possibilities. Florman: *\"the existential pleasures of engineering\"* (vdP p.14) | Not wrong in itself, since intrinsic motivation is good. The danger is overlooking negative effects | Google Earth (privacy, security); **Wernher von Braun**: *\"My refusal to join the party would have meant that I would have had to abandon the work of my life. Therefore, I decided to join\"* (vdP p.15) |\n| **Effectiveness and efficiency** | Effectiveness = how far a goal is achieved. Efficiency = goal achieved \u00f7 effort (vdP p.16) | Seems \"neutral and objective\" but is **value-laden**: it presupposes an external goal, which *\"can be\u2026 war or even genocide\"*, and the choice of inputs is value-laden too (vdP p.18) | **Taylor** and scientific management. **Eichmann**, *\"proud of the efficient way\"* he contributed to genocide (Arendt) (vdP p.18) |\n| **Human welfare** | *\"Engineers shall hold paramount the safety, health and welfare of the public\"* (codes, p.19). Safety is central. For software, privacy and reliability | Morally laudable. It shows engineering *\"is not something that is morally neutral and that engineers do more than merely develop neutral means for the goals of others\"* (vdP p.21) | **Johan van Veen** (\"the new Cassandra\") and the Dutch dykes / 1953 flood (pp.19\u201320) |\n\n**9. Engineers vs managers: three models** (vdP pp.21\u201325; L9 s27\u201328):\n- **Separatism:** *\"scientists and engineers should apply the technical inputs, but appropriate management and political organs should make the value decisions\"* (Goldberg, quoted vdP p.21).\n  - The **tripartite model** illustrates it: politicians and managers / engineers / users. Engineers are responsible only for technical creation.\n  - Boisjoly after the disaster: *\"I had my say\"*.\n  - The danger is the **\"hired gun\"**. Tom Lehrer's lyric about von Braun: *\"Once the rockets go up / Who cares where they come down / 'that's not my department'\"* (vdP p.22).\n- **Technocracy** (Taylor): government by experts. Problems: (i) engineers have no special expertise about goals or acceptable risk (the *technocratic fallacy*); (ii) it is **undemocratic and paternalistic**, and paternalism *\"denies that people have the right to shape their own lives\"* and clashes with **moral autonomy** (vdP p.23). That is a Kantian point.\n- **Whistle-blowing:** disclosing abuses *\"without the consent of his/her superiors\"* to remedy them or warn the public (vdP p.24).\n  - Example: **Inez Austin** (Hanford).\n  - **De George's five conditions** (vdP p.24): (1) serious harm to the public; (2) reported to the immediate superior without effect; (3) internal procedures exhausted; (4) evidence that would convince a reasonable, impartial observer; (5) good reason to believe disclosure will prevent the harm at reasonable cost.\n  - Problems: **sacrifice** and **limited effect**, because communication has already broken down (vdP p.25).\n- **vdP's preferred alternative:** a cooperative model where engineers *\"think about broader issues than just engineering decisions but do not decide on these issues alone\"* (vdP p.29).\n\n**10. The social context of technology** (vdP pp.25\u201328; L9 s29\u201332):\n- **Actors:** developers and producers, users, regulators.\n- **Stakeholders:** have an interest but can't necessarily steer the technology. Morality says *don't neglect them because they are powerless*.\n- **Unpredictability:** Teflon.\n- **The Collingridge dilemma:** early on, consequences can't be predicted. Later, the technology is entrenched and hard to change. **Constructive Technology Assessment** (CTA) runs alongside development and feeds back into design.\n- **Net effect on responsibility:**\n  - It **diminishes** responsibility, since there are many actors and causal contribution and foreseeability are reduced.\n  - It **extends** responsibility, since engineers must involve stakeholders (vdP p.28; L9 s32).\n\n**11. Extra lecture-only material** (L9 s26, s33\u201337):\n- *\"If engineering involves means-ends reasoning, then ethics involves ends-means reasoning\"*, so **ethics is more foundational than engineering** (L9 s26).\n- India's \"social conscience of science\": Dhruv Raina; Amulya Reddy's **ASTRA** (*\"a weapon (or asthra in Sanskrit) in the interests of the poor\"*, Reddy 1988, L9 s34).\n- Edgerton, \"In Praise of Luddism\" (2011).\n- **Arendt on Eichmann:** *\"Could the activity of thinking as such\u2026 be among the conditions that make men abstain from evil-doing\"* (\"Thinking and Moral Considerations\", 1971, L9 s36). It connects to von Braun and the hired gun, and to Aristotle (the thoughtless person lacks phronesis).\n\n### B. Reading guide: vdP Ch.1\n- **Thesis:** engineers carry **both passive and active responsibility.** Their professional responsibility is bounded by morality and includes the ideal of human welfare. Neither separatism, technocracy nor routine whistle-blowing handles the engineer\u2013manager tension well. The social context both narrows and widens engineers' responsibility.\n- **Main case:** Challenger, used to illustrate *every* condition. **Supporting cases:** von Braun (enthusiasm, hired gun), Taylor (efficiency, technocracy), van Veen (welfare, near-whistle-blower), Inez Austin (whistle-blowing), Teflon (unpredictability).\n\n---\n\n## PART 6: How the end-sem topics connect\n\n```\n           L2 meta-ethics: is/ought; Euthyphro; Mackie's queerness\n                          \u2502\n   THEORIES OF THE GOOD \u2500\u2500\u253c\u2500\u2500 THEORIES OF THE RIGHT \u2500\u2500\u253c\u2500\u2500 VIRTUE ETHICS\n   (L4 hedonism, DST,     \u2502   (L7 Kant)               \u2502   (L8 Aristotle)\n    L5 Mill, L6 Bentham,  \u2502   good will, duty,        \u2502   eudaimonia, function,\n    act/rule util)        \u2502   CI: FUL + FH,           \u2502   habit, mean, phronesis,\n    consequences          \u2502   autonomy; motives       \u2502   exemplars; character\n         \u2502                \u2502        \u2502                  \u2502        \u2502\n         \u2502   Trolley/patient/DDE (L6 s17, L7 s25\u201331) \u2014 util vs Kant vs Foot\n         \u2502   Experience machine (L4) \u2192 Aristotle's \"activity\", zoon politikon\n         \u2502   Mill's competent judge \u2248 Aristotle's practically wise person\n         \u2502   Kant's cold duty vs Aristotle's pleasure in virtue\n         \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                          \u25bc\n           L9 RESPONSIBILITY (vdP Ch.1)\n   wrong-doing \u2190 needs a norm from one of the three theories\n   causal contribution \u2190 omissions (Singer's pond)\n   foreseeability \u2190 util's foresight problem; Collingridge\n   freedom \u2190 ought implies can (L1\u20132); hypothetical/categorical\n   active resp. = virtues (vdP p.13); Bovens 5 features \u2194 u
