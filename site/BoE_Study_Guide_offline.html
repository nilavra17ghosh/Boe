til/Kant/virtue\n   ideals: efficiency value-laden \u2190 is/ought gap (L1); Eichmann \u2194 Arendt\n   technocracy = paternalism \u2190 violates Kantian autonomy\n   role vs moral responsibility \u2190 Ross prima facie; Kant's perfect duty\n```\n\n**Two theory comparison tables to memorise**\n\n| | Utilitarianism | Kant | Aristotle |\n|---|---|---|---|\n| Basis of rightness | Optimific results | Maxim passes the CI; done from duty | What the virtuous person would characteristically do |\n| Role of motive | Irrelevant to rightness | Everything (the good will) | Essential: choice \"for its own sake\" plus firm character |\n| Role of emotion | Pleasure is *the* good | Inclination gives no moral worth | Right feeling is *part* of virtue |\n| Precision | Calculable in principle (hedonic calculus) | Universal and exceptionless (perfect duties) | Inexact, \"no fixity\", decided by perception |\n| Patient's dilemma | AU: maybe harvest; RU: no | Never: uses him merely as a means | A just, practically wise doctor wouldn't |\n| Classic objection | Rights, justice, demandingness | Rigidity, consequences, animals, cold duty | Guidance, priority problem, choosing exemplars |\n\n---\n\n## PART 7: Question bank\n\nLabels: **[HIGH]** means strongly supported by PYQ repetition and the syllabus notice. **[MED]** means plausible. **[SPEC]** means a speculative variant. No prediction is certain.\n\n### 7.1 High-priority questions\n\n**Q1 [HIGH]. What is moral responsibility? Distinguish active and passive responsibility. Describe the three forms of passive responsibility and the four conditions of blameworthiness. Apply them to the Challenger case.**\n- *What it tests:* the vdP vocabulary and lists, plus application. The 2024 Q1 almost certainly repeats in some form.\n- *Structure:* (1) Define responsibility, mentioning omissions (vdP p.9). (2) Active vs passive, one line each, plus the virtue link (p.13). (3) Accountability, blameworthiness, liability. (4) The four conditions, each with Challenger evidence. (5) Inference: blame comes in degrees, and Boisjoly's is diminished by pressure but not removed by it. Conclude that NASA and Thiokol management are most blameworthy.\n- *Bonus links:* ought implies can; Bovens's five features if active responsibility needs more.\n\n**Q2 [HIGH]. How do roles relate to responsibilities? How would a utilitarian, a Kantian and a virtue ethicist respond when moral responsibility conflicts with professional responsibility? Give a real example.** (2024 Q3, cross-cutting)\n- See **Model Answer 1** below.\n\n**Q3 [HIGH]. What is virtue for Aristotle and how is it acquired? Distinguish intellectual and moral virtues and explain how they are related.** (2024 Q4)\n- See **Model Answer 2** below.\n\n**Q4 [HIGH]. Distinguish \"means to an end\" from \"end in itself\" with examples. How are fairness, consistency and humanity accounted for in Kantian ethics?** (2024 Q5)\n- See **Model Answer 3** below.\n\n**Q5 [HIGH]. Explain Kant's distinction between hypothetical and categorical imperatives. State the Formula of Universal Law and apply it to two of Kant's examples.**\n- *Structure:* define both with examples from L7 s9 and pop-quiz Q16. Explain why moral duties are categorical (they bind regardless of desire, so immorality is irrational). Give FUL (LE p.90) and the three-part test (L7 s13). Apply it to the false promise (contradiction in conception) and to non-beneficence (contradiction in will). Explain perfect vs imperfect duty (footnote 2).\n\n**Q6 [HIGH]. Explain the difference between acting \"from duty\" and \"in conformity with duty\". Why does Kant say only the former has moral worth? Is he right?**\n- *Structure:* the good will (jewel passage) \u2192 the shopkeeper and the philanthropist \u2192 moral worth lies in the *maxim*, not the effect (LE p.88). Evaluate: the \"functionalism of duty\" objection (L7 s32) and Aristotle's opposite view that the virtuous person *enjoys* acting well (LE pp.144\u2013145). Possible reply on Kant's behalf: Kant uses cases without inclination only to *isolate* duty, not to say feelings are bad *(interpretive)*.\n\n### 7.2 Conceptual questions\n- [MED] Explain Aristotle's doctrine of the mean. Why is it \"relative to us\"? Do all actions admit of a mean? (LE pp.146\u2013147; Milo; spite and murder)\n- [MED] What are Aristotle's three conditions for an act to be virtuous? How do they resolve the circularity puzzle? (LE pp.145\u2013146)\n- [MED] Explain eudaimonia and the function argument. (L8 s9; LE p.146 eye/horse)\n- [MED] What is the Doctrine of Double Effect? Use it to distinguish the trolley problem from the patient's dilemma. (L7 s30; pop-quiz Q12)\n- [MED] Explain the Collingridge dilemma and its implications for engineers' responsibility. (vdP pp.27\u201328)\n- [MED] What are the professional ideals of engineers? Which is morally commendable and why? (vdP pp.13\u201321; study Q10)\n- [SPEC] What is the Knobe effect, and what does it suggest about intention? (L7 s22\u201324)\n\n### 7.3 Critical and argumentative questions\n- [MED] \"Efficiency is a value-neutral engineering goal.\" Critically examine this. (vdP pp.16\u201318: value-laden external goal; Eichmann; choice of inputs. Link to the is\u2013ought gap.)\n- [MED] Critically assess the claim that the virtuous person, not a rule, is the standard of right action. (Hursthouse; priority problem; guidance; Aristotle's \"decision rests with perception\")\n- [MED] Is whistle-blowing a moral duty or supererogatory? (De George; vdP p.25 \"big sacrifices\"; L6 supererogation vs obligation; Kantian perfect vs imperfect duties)\n- [MED] Evaluate separatism and technocracy as models of the engineer\u2013manager relationship. (vdP pp.21\u201323, 29)\n- [SPEC] Can AI systems be morally responsible? (L9 s5 causal vs moral; the four conditions; L7 s21 functions vs intentions; Kant's \"from duty\")\n\n### 7.4 Comparative questions\n- [HIGH] Compare how Kant and Aristotle treat the role of emotion or inclination in moral action. (Philanthropist vs \"delight in\" virtue; continence)\n- [MED] Compare utilitarian, Kantian and virtue-ethical responses to the patient's dilemma or trolley problem.\n- [MED] Theories of the good vs theories of the right: where does virtue ethics fit? (Pop-quiz Q1; L4 s7 levels of evaluation)\n- [MED] Kant's universal law vs Aristotle's \"no fixity\" and particularism: which better fits engineering ethics? (Codes of conduct and Bovens's \"consistent code\" vs phronesis and \"adequate perception\")\n- [SPEC] Compare Mill's \"competent judges\" with Aristotle's \"man of practical wisdom\" as moral standards.\n\n### 7.5 Application questions\n- [HIGH] An engineer is told by a manager to sign off on software with a known safety bug before a deadline. Analyse the case using the four conditions and the three theories. (Same pattern as Q2)\n- [MED] Apply the categorical imperative to: plagiarism / pirating textbooks (libgen) / cheating on taxes. (L7 s8, s18)\n- [MED] Was Boisjoly morally responsible? Was his separatist stance defensible? (vdP Discussion Q1, p.30)\n- [MED] Facial recognition replicates bias. Who is responsible? (L7 s20; L9 s5; four conditions; stakeholders)\n- [SPEC] Can companies be morally responsible as distinct from people? (vdP Discussion Q2)\n\n### 7.6 Reading-based questions\n- [HIGH] Identify the author and explain: *\"Virtue, then, is a state of character concerned with choice, lying in a mean\u2026\"* (Same pattern as the Quiz-1 Mill question)\n- [HIGH] Identify the author and explain: *\"So act that you use humanity, whether in your own person or in the person of any other, always at the same time as an end, never merely as a means.\"*\n- [MED] *\"\u2026like a jewel, it would still shine by itself\u2026\"* Who wrote it, what is \"it\", and what does it show?\n- [MED] *\"Neither by nature, then, nor contrary to nature do the virtues arise in us\u2026\"* Explain.\n- [MED] *\"Once the rockets go up / Who cares where they come down\u2026\"* What model of engineering responsibility does this satirise? (vdP p.22; separatism / hired gun)\n- [MED] *\"\u2026we become just by doing just acts\u2026\"* Explain and resolve the apparent circularity.\n\n### 7.7 Quiz-1-style questions on the end-sem syllabus, with mock answer keys\nThese copy the *format* of each 2026 Quiz-1 question and apply it to the new readings. The keys follow the professor's scheme: \u00bd mark for the label, 1 mark for the description, plus a mark for the correct order. Practise reproducing the **bold labels** exactly.\n\n**A. \"Reconstruct the argument as it appears in the reading, in the form discussed in class, and bring out two flaws.\"** (The pattern of Quiz-1 Q1)\n\n*A1. Reconstruct Kant's false-promise argument (LE pp.88\u201390) using the three-step universalizability test discussed in class. Bring out two limitations of the test.*\n\n| Step (class label, L7 s13) | Maps onto Kant's text |\n|---|---|\n| **1. Formulate the maxim** | \"when I believe myself to be in need of money I shall borrow money and promise to repay it, even though I know that this will never happen\" (LE p.91) |\n| **2. Universalize it: imagine a world where everyone acts on it** | \"how would it be if my maxim became a universal law?\" (LE p.91) |\n| **3. Can the goal still be achieved?** No. \"no one would believe what was promised\", so the maxim \"would have to destroy itself\" (LE p.89). It fails **consistency** and **fairness**, so it is a **perfect duty** not to make false promises |\n\nThe order matters: maxim \u2192 universalize \u2192 test the goal. **Limitations (any two):**\n1. The test is compatible with slavery and tyranny of the majority, which is why FH is needed (L7 s14).\n2. It ignores severe consequences (L7 s32).\n3. Perfect duties are rigid when duties conflict.\n4. Narrowly worded immoral maxims can pass, and harmless ones can fail (LE p.93 Q5).\n\n*A2. Reconstruct Aristotle's argument for what virtue is (LE pp.146\u2013147) using the genus/differentia structure discussed in class. Bring out two objections.*\n\n| Step (class label, L8 s20\u201323) | Maps onto the text |\n|---|---|\n| **1. Genus: the soul has passions, faculties, states of character** | Virtue isn't a **passion**: we aren't praised for merely feeling, and passions involve no choice. It isn't a **faculty**: faculties come by nature. So it is a **state of character** |\n| **2. Differentia: a disposition to choose the mean** | Excellence makes a thing do its work well (the eye). The mean is **relative to us** (Milo) |\n| **3. Definition** | \"a state of character concerned with choice, lying in a mean\u2026 determined by\u2026 the man of practical wisdom\" |\n\n**Objections (any two):**\n1. The **priority problem**, a Euthyphro-style dilemma (LE pp.142\u2013143).\n2. **Inadequate guidance** when virtues conflict (LE p.140).\n3. **Who are the exemplars?** (LE p.140).\n4. \"**Moderate murder**?\" Answered by \"no mean\" for acts bad by their very name (LE p.147).\n\n*A3. Reconstruct the case for blaming Morton Thiokol's management using the four conditions of blameworthiness. Bring out two complications.*\n- **Labels in order:** wrong-doing \u2192 causal contribution \u2192 foreseeability \u2192 freedom. Map each onto a Challenger fact (see Part 5, table 5).\n- **Complications (any two):**\n  1. Blame comes in degrees, and pressure reduces it (vdP p.11).\n  2. With many actors, each one's causal contribution and foresight is smaller (vdP p.29).\n  3. Omissions count as causes, so Boisjoly is implicated too.\n  4. Collingridge: consequences are often unforeseeable early on.\n\n**B. \"From a [meta-ethical / normative] standpoint, how is X different from Y? Briefly outline Z as it appears in the essay.\"** (The pattern of Quiz-1 Q2)\n\n*B1. From a normative standpoint, how does Kant's ethics differ from utilitarianism? Outline the distinction between acting from duty and acting in conformity with duty as it appears in the reading.*\n- **Kant: theory of the right** (\u00bd). Right is prior to the good; the act is judged by its maxim and motive; the good will is unconditionally good (1).\n- **Utilitarianism: theory of the good** (\u00bd). Right is whatever produces the most good; the act is judged by its consequences (1).\n- **In conformity with duty** (\u00bd): the shopkeeper's honesty comes from self-interest, so it has no moral worth (1).\n- **From duty** (\u00bd): the grieving philanthropist helps \"without any inclination\", so \"then the action first has its genuine moral worth\" (1).\n\n*B2. How does Aristotle's virtue ethics differ from Kant's deontology? Outline \"the mean relative to us\" as it appears in the reading.*\n- **Level of evaluation:** character vs motive/maxim. **Precision:** \"no fixity\" vs universal law. **Emotion:** right feeling is part of virtue vs inclination gives no moral worth.\n- **Mean in the object** (arithmetic: 6 between 10 and 2) vs **mean relative to us** (Milo vs the beginner).\n\n**C. \"Who is the author of this quotation? Bring out three points of ethical significance.\"** (The pattern of Quiz-1 Q3)\n- See the three-point drills in 9.2. Possible new quotations: the jewel, the humanity formula, the definition of virtue, \"neither by nature\u2026\", the Lehrer lyric, \"Each role brings with it certain responsibilities\".\n- **Remember the cross-lecture point** the key rewarded (Mill \u2192 Nozick). Examples: the jewel \u2192 against Bentham's hedonism; Aristotle's \"delight\" in virtue \u2192 against Kant's dutiful man; efficiency is value-laden \u2192 the is\u2013ought gap.\n\n**D. \"Here is a dilemma. In the context of (1) X and (2) Y: (a) what is the right thing to do, (b) on what basis? Give one limitation of each.\"** (The pattern of Quiz-1 Q4)\n\n*D1. The patient's dilemma, for (1) Kantian ethics and (2) virtue ethics.*\n- **Kant, (a):** don't harvest the organs. **(b):** FH forbids using the healthy man *merely as a means*, since he \"cannot possibly agree\". The maxim \"kill the innocent to save more\" also can't be universalized: no one would visit a hospital. **Limitation:** it ignores the five deaths and severe consequences; rigidity.\n- **Virtue ethics, (a):** don't harvest. **(b):** a just, practically wise doctor would never characteristically do this; justice and trust are part of the healer's role and excellence. **Limitation:** gives little concrete guidance in harder cases; the priority problem.\n\n*D2. A manager orders an engineer to ship software with a known safety bug before a deadline. For (1) a Kantian and (2) a virtue ethicist: what is right, and on what basis? One limitation each.*\n- **Kant:** refuse and disclose. Loyalty to the employer is only a hypothetical imperative, while the duty not to deceive users is categorical, and deceiving users uses them merely as means. **Limitation:** may cost the job; doesn't weigh the consequences.\n- **Virtue ethics:** courage (the mean between silence and reckless leaking), honesty and phronesis mean escalating internally first, then following De George's conditions. **Limitation:** \"what would the virtuous person do\" is underdetermined.\n- **Grading note from the key:** your verdict can vary. **State the grounding principle.**\n\n---\n\n## PART 8: How to write answers for this examiner\n\n### 8.1 Template for a 10-mark answer (300\u2013400 words, about 17 minutes)\n1. **Opening (2\u20133 lines):** define the key term *in the course's words* and place it in the framework (\"Kant's is a theory of the right\u2026\"). That earns a point immediately.\n2. **Body: one labelled block per sub-question.** Use the question's own parts as headings: (a), (b), (c). The examiner counts points, so make each point visible.\n3. **Lists as numbered items** with one explanatory clause each. Never give the bare list.\n4. **One example per concept.** Prefer course examples (Challenger, shopkeeper, Milo, von Braun).\n5. **One short quotation or precise paraphrase per answer.** Name the author and work in the sentence itself (\"As Aristotle puts it in Book II of the *Nicomachean Ethics*, \u2026\").\n6. **Objection and reply (2\u20133 lines)** wherever the question says evaluate, critically, or would you. That is where \"inferences you draw\" are scored.\n7. **Closing line that commits to a position** or states the main inference.\n\n### 8.2 Using quotations naturally\n- **Fold the quotation into your own sentence** instead of setting it apart: *Kant holds that the good will's worth is unaffected by results; even if it achieved nothing, \"like a jewel, it would still shine by itself.\"*\n- **Only quote what you then use.** Follow each quotation with \"This means\u2026\" or \"Hence\u2026\".\n- Keep quotations **under about 25 words**. Quote the *key formulation* (the CI, FH, the definition of virtue). Paraphrase the rest.\n- If you aren't sure of the exact words, **paraphrase without quote marks.** An exact paraphrase earns the same point.\n\n### 8.3 Presenting objections\nName the objection, then give the best reply, then your verdict: *\"An objection is X (source). A Kantian may reply Y. But Y does not fully meet the objection because Z / Y succeeds because Z.\"* Bring in a rival theory as the objector. That is the easiest \"connection to earlier topics\" mark.\n\n### 8.4 Common mistakes\n- Saying Kant **forbids using people as means.** He forbids using them *merely* as means.\n- Treating the **mean as moderation or average.** It is \"relative to us\" and \"an extreme with regard to what is best\".\n- Saying **intellectual virtue comes from habit.** It comes from *teaching*. Moral virtue comes from *habit*.\n- Mixing up **accountability and liability.** Liability is *legal*.\n- Treating **freedom as all-or-nothing.** Pressure *reduces* responsibility but doesn't remove it.\n- Calling **efficiency value-neutral.** vdP says it is value-laden.\n- Mixing up **act and rule utilitarianism** on the patient's dilemma. AU may permit harvesting; RU forbids it because a rule permitting it isn't optimific.\n- Calling the **Golden Rule** Kant's test. L7 s11 rejects it because it depends on what a person happens to desire.\n- Attributing **\"consequentialism\"** to Bentham. Anscombe coined it. Attributing **the trolley problem's name** to Foot. Thomson named it; Foot introduced the case.\n\n### 8.5 Model answers (about 380\u2013420 words each)\n\n---\n**Model Answer 1.** *How do roles and responsibilities relate? How would a utilitarian, a Kantian and a virtue ethicist respond when moral responsibility conflicts with professional responsibility? Illustrate with a real example.*\n\n**Roles and responsibilities.** van de Poel and Royakkers note that \"each role brings with it certain responsibilities\": as employee, engineer, expert, colleague, parent. These role responsibilities can be formal (contracts, professional codes) or informal (family). Because we occupy several roles at once, they can conflict. Moral responsibility, which rests on moral norms and duties, is not confined to roles. It can **extend beyond** them and can **limit** them; no one has a genuine responsibility to perform the role of a Mafioso. Hence professional responsibility is role-based responsibility only *\"in as far it stays within the limits of what is morally allowed.\"* In W.D. Ross's terms, a role yields *prima facie* duties, which must be weighed against duties all things considered.\n\n**Example: Challenger (1986).** Roger Boisjoly, as a Morton Thiokol **employee**, was expected to be loyal to managers who wanted the launch to go ahead for contractual reasons. As an **engineer**, he was expected to give safety-minded technical advice: the O-rings were untested below 11\u00b0C. Management overrode him, and seven astronauts died.\n\n**(a) Utilitarian.** The right act maximises overall well-being. Weighing seven lives and public trust against a contract and a delayed schedule, an act utilitarian requires refusing to launch and, if necessary, escalating. A rule utilitarian reaches the same verdict through an optimific rule such as \"engineers must hold public safety paramount\". *Limit:* the verdict depends on foreseeing consequences. Boisjoly lacked conclusive data, so the outcome is uncertain.\n\n**(b) Kantian.** Moral duty is categorical. Loyalty to an employer is only hypothetical (\"if you want to keep your job\u2026\"). The maxim \"certify as safe what I believe may be unsafe, to secure a contract\" cannot be universalized, because certification would lose its meaning. It also treats the astronauts *merely as a means*, since they could not consent to a concealed risk. Boisjoly must not endorse the launch whatever the cost to him.\n\n**(c) Virtue ethicist.** The question becomes what an honest, courageous and practically wise engineer would *characteristically do*. Courage is the mean between cowardice (silence) and rashness (reckless sabotage). Phronesis would push him to raise concerns *earlier*, use internal channels, and, following De George's conditions, go public if those failed. This matches Bovens's view of active responsibility as a *virtue*.\n\n**Conclusion.** All three theories put the moral above the merely professional-as-employee role, for different reasons: outcomes, duty, character. Boisjoly's freedom was limited by pressure, which reduces his blameworthiness, but his responsibility was not removed.\n\n---\n**Model Answer 2.** *How does virtue ethics work? What is virtue and how is it acquired according to Aristotle? Describe the intellectual and moral virtues and their relation.*\n\n**How virtue ethics works.** Utilitarianism evaluates consequences and Kant evaluates motives. Virtue ethics evaluates **character**. It shifts the question from \"what should I do?\" to \"how should I live?\" Right action is what a virtuous agent would characteristically do (Hursthouse), so we act well by *becoming* good people. Its three components are **eudaimonia** (flourishing), **virtue** and **phronesis**. By Aristotle's function argument, a thing's excellence makes it do its work well (the eye sees well), and since the human function is rational activity, human virtue is the state that makes us live rationally well.\n\n**What virtue is.** Aristotle argues by genus and differentia. The soul has passions, faculties and states of character. Virtue isn't a passion, because we aren't praised for merely feeling fear and passions involve no choice. It isn't a faculty, because faculties come by nature. So virtue is a **state of character**, specifically a disposition to choose the mean: *\"a state of character concerned with choice, lying in a mean, i.e. the mean relative to us\u2026 determined by\u2026 the man of practical wisdom.\"* The mean is \"relative to us\": six pounds of food is too little for Milo and too much for a beginner. Courage lies between cowardice and rashness, liberality between meanness and prodigality. Some acts, like murder and theft, have no mean.\n\n**How it is acquired.** Virtues arise \"neither by nature, nor contrary to nature\": we are adapted by nature to receive them and perfected by **habit**. A stone can't be trained to rise, but we \"become just by doing just acts\", as builders become builders by building. To answer the apparent circularity, a truly virtuous act also requires that the agent (1) has knowledge, (2) chooses the act for its own sake, and (3) acts from a firm and unchangeable character. Taking **pleasure** in the act is the sign that the virtue has formed, hence the importance of upbringing.\n\n**Intellectual vs moral virtues.** Intellectual virtue grows from **teaching** and needs experience and time. Moral virtue grows from **habit** (*\u0113thik\u0113* from *ethos*). The five intellectual virtues are episteme, techne, phronesis, nous and sophia. Moral virtues include courage, temperance, liberality and justice.\n\n**Their relation.** The definition itself joins them: the mean is fixed by the rational principle of the person of **practical wisdom**. Without phronesis, a good disposition can't find the right act \"at the right time, towards the right people, in the right way\". Phronesis in turn matures only through habituated experience. So moral virtue sets the right end, and phronesis finds the right means in each situation.\n\n---\n**Model Answer 3.** *Distinguish \"means to an end\" from \"end in itself\" with an example of each. How are fairness, consistency and humanity accounted for in Kantian ethics?*\n\n**Means vs end in itself.** Something is a *means* when it is valued for what it brings about. Its worth is conditional, like a tool, money or a hypothetical imperative (\"if you want the job, take the course\"). An *end in itself* has unconditional worth, independent of anyone's desires. For Kant, *\"rational beings are called persons because their nature already marks them out as an end in itself,\"* whereas non-rational beings \"have only a relative worth, as means, and are therefore called things.\" Example of a means: a calculator I use to finish my assignment. Example of an end in itself: the friend I help study, whose own goals I adopt as mine. Kant doesn't forbid using people as means. I use a shopkeeper to buy groceries. What he forbids is using anyone *merely* as a means, in a way they *\"cannot possibly agree to\"*.\n\n**Consistency.** Kant's first formulation: *\"act only in accordance with that maxim through which you can at the same time will that it become a universal law.\"* Test: formulate your maxim, imagine everyone acting on it, and ask whether your goal is still achievable. A lying promise fails: if everyone promised falsely, no one would believe promises, so the maxim \"would have to destroy itself.\" Universal plagiarism would likewise make assessment meaningless. An inconsistent maxim is irrational, which is why for Kant immorality is irrational.\n\n**Fairness.** When we do wrong, Kant notes, we don't really want our maxim to be universal law. *\"we take the liberty of making an exception to it for ourselves (or just for this once).\"* Universalizability forbids this free-riding: it is unfair to profit from a rule while expecting everyone else to keep it. Consistency and fairness are thus the two criteria of universalizability.\n\n**Humanity.** Consistency alone might allow tyranny of the majority or slavery, so Kant adds: *\"So act that you use humanity, whether in your own person or in the person of any other, always at the same time as an end, never merely as a means.\"* Humanity, meaning our rational, **autonomous** capacity to legislate our own ends (*autos* + *nomos*), has intrinsic worth. Deception and coercion violate it because they bypass the other person's rational agency. In the patient's dilemma, harvesting the healthy man's organs uses him merely as a means, however good the outcome.\n\n**Evaluation.** The formulations explain why rights can't be traded for utility. Critics argue that Kant cannot account for animals, which aren't rational, and that his perfect duties are too rigid when consequences are severe.\n\n---\n\n## PART 9: Final revision material\n\n### 9.1 One-page revision sheet\n- **L6:** consequentialism (Anscombe's term); Bentham's 7-part calculus; Mill's quality; AU vs RU (optimific *social rule*); objections: quantification, foresight, demandingness (Singer), justice and rights (patient's dilemma); Smart's \"rule worship\"; EA and longtermism; TESCREAL.\n- **L7 + Kant:** theory of the right; good will (jewel); from duty vs in conformity (shopkeeper, philanthropist); maxim; hypothetical vs categorical; FUL; three-part test; fairness and consistency; four examples (suicide, false promise, talents, beneficence); perfect vs imperfect duties; FH and persons vs things; autonomy; DDE; Knobe; Foot's negative vs positive duties; objections (animals, rigidity, cold duty, AI).\n- **L8 + Aristotle:** how should one live; eudaimonia and function; moral virtue (habit) vs intellectual virtue (teaching); \"neither by nature nor contrary to nature\"; learning by doing; ethics has \"no fixity\"; excess and defect; pleasure as sign and education; three conditions; passions, faculties, states; mean relative to us (Milo); THE DEFINITION; no mean for murder; virtue table; extremes; Calypso and the bent stick; phronesis; five intellectual virtues; exemplars; Hursthouse; priority problem.\n- **L9 + vdP:** responsibility and omissions; causal vs moral; active vs passive; accountability, blameworthiness, liability; wrong-doing, causation, foreseeability, freedom (degrees); roles (formal/informal), moral vs professional (\"within the limits of what is morally allowed\"); Ross; Bovens's five; ideals (enthusiasm and von Braun; efficiency and Taylor/Eichmann; welfare and van Veen); separatism and tripartite model and hired gun; technocracy and paternalism; whistle-blowing (Austin; De George's 5); actors and stakeholders; Collingridge and CTA; diminishes and extends responsibility; engineering as means-ends vs ethics as ends-means; Arendt.\n\n### 9.2 Quotation bank (all checked against the source files)\n\n**Kant** (*Groundwork*, trans. Gregor, in LE)\n| Use for | Quotation | Page |\n|---|---|---|\n| Good will | \"It is impossible to think of anything at all in the world, or indeed even beyond it, that could be considered good without limitation except a good will.\" | LE p.86 |\n| Worth independent of results | \"\u2026like a jewel, it would still shine by itself, as something that has its full worth in itself.\" | LE p.87 |\n| Duty and moral worth | \"\u2026he is beneficent not from inclination but from duty.\" | LE p.88 |\n| Supreme principle | \"I ought never to act except in such a way that I could also will that my maxim should become a universal law.\" | LE p.88 |\n| False promise | \"\u2026my maxim, as soon as it were made a universal law, would have to destroy itself.\" | LE p.89 |\n| Categorical imperative | \"act only in accordance with that maxim through which you can at the same time will that it become a universal law.\" | LE p.90 |\n| Fairness | \"\u2026we take the liberty of making an exception to it for ourselves (or just for this once)\u2026\" | LE p.91 |\n| Persons vs things | \"\u2026rational beings are called persons because their nature already marks them out as an end in itself\u2026\" | LE p.91 |\n| Humanity | \"So act that you use humanity, whether in your own person or in the person of any other, always at the same time as an end, never merely as a means.\" | LE p.92 |\n| Consent test | \"\u2026he whom I want to use for my purposes by such a promise cannot possibly agree to my way of behaving toward him\u2026\" | LE p.92 |\n| Moral law within (slide) | \"the starry heaven above me and the moral law within me\" | L7 s7 |\n\n*Note: L7 s7 attributes the \"starry heaven\" line to the* Critique of Judgment*; L2 s12 just calls it \"Kant's famous dictum\". It actually comes from the conclusion of the* Critique of Practical Reason*. If you use it, attribute it simply to Kant.*\n\n**Aristotle** (*Nicomachean Ethics* II, trans. Ross, in LE)\n| Use for | Quotation | Page |\n|---|---|---|\n| Two kinds of virtue | \"intellectual virtue in the main owes both its birth and its growth to teaching\u2026 while moral virtue comes about as a result of habit\" | LE p.144 |\n| Nature | \"Neither by nature, then, nor contrary to nature do the virtues arise in us; rather we are adapted by nature to receive them, and are made perfect by habit.\" | LE p.144 |\n| Learning by doing | \"\u2026we become just by doing just acts, temperate by doing temperate acts, brave by doing brave acts.\" | LE p.144 |\n| Practical aim | \"\u2026we are inquiring not in order to know what virtue is, but in order to become good\u2026\" | LE p.144 |\n| Inexactness | \"\u2026matters concerned with conduct and questions of what is good for us have no fixity, any more than matters of health.\" | LE p.144 |\n| Education | \"\u2026so as both to delight in and to be pained by the things that we ought; this is the right education.\" | LE p.145 |\n| Virtuous agent | \"\u2026it is not the man who does these that is just and temperate, but the man who also does them as just and temperate men do them.\" | LE p.146 |\n| Mean, right way | \"\u2026at the right times, with reference to the right objects, towards the right people, with the right motive, and in the right way\u2026\" | LE p.147 |\n| Definition | \"Virtue, then, is a state of character concerned with choice, lying in a mean, i.e. the mean relative to us\u2026\" | LE p.147 |\n| Difficulty | \"For men are good in but one way, but bad in many.\" | LE p.147 |\n| No mean for vice | \"\u2026however they are done they are wrong\u2026\" | LE p.147 |\n| Hard to be good | \"\u2026anyone can get angry\u2014that is easy\u2026 but to do this to the right person, to the right extent, at the right time\u2026 that is not for everyone, nor is it easy\" | LE p.149 |\n| Perception | \"\u2026the decision rests with perception.\" | LE p.150 |\n\n**van de Poel and Royakkers** (Ch.1)\n| Use for | Quotation | Page |\n|---|---|---|\n| Responsibility | \"\u2026being held accountable for your actions and for the effects of your actions.\" | vdP p.9 |\n| Active | \"\u2026responsibility before something has happened. It refers to a duty or task to care for certain state-of-affairs or persons.\" | vdP p.9 |\n| Roles | \"Each role brings with it certain responsibilities.\" | vdP p.9 |\n| Professional responsibility | \"\u2026based on your role as a professional engineer in as far it stays within the limits of what is morally allowed.\" | vdP p.10 |\n| Degrees of blame | \"The extent to which you can be blamed is determined by the degree to which these conditions are fulfilled.\" | vdP p.11 |\n| Active responsibility = virtue | \"Active responsibility is not primarily about blame but requires a certain positive attitude or character trait\u2026\" | vdP p.13 |\n| Efficiency | \"\u2026effectiveness and efficiency suppose an external goal\u2026 That external goal can be\u2026 war or even genocide.\" | vdP p.18 |\n| Codes | \"Engineers shall hold paramount the safety, health and welfare of the public\" | vdP p.19 |\n| Not neutral | \"\u2026engineers do more than merely develop neutral means for the goals of others.\" | vdP p.21 |\n| Separatism (Goldberg) | \"\u2026scientists and engineers should apply the technical inputs, but appropriate management and political organs should make the value decisions\" | vdP p.21 |\n| Hired gun (Lehrer) | \"Once the rockets go up / Who cares where they come down / 'that's not my department,' said Wernher von Braun.\" | vdP p.22 |\n| Von Braun | \"My refusal to join the party would have meant that I would have had to abandon the work of my life. Therefore, I decided to join\" | vdP p.15 |\n| Paternalism | \"\u2026paternalism denies that people have the right to shape their own lives.\" | vdP p.23 |\n\n**Three-point drills for quote identification** (the Quiz-1 Q3 format)\n- **\"\u2026like a jewel, it would still shine by itself\u2026\" (Kant, *Groundwork*, LE p.87).**\n  1. The good will is the only thing good *without limitation*; talents and fortune can turn evil.\n  2. Moral worth doesn't depend on results, so this is a theory of the right, against utilitarianism.\n  3. Worth lies in acting *from duty*, in the maxim (the shopkeeper vs the philanthropist).\n- **\"So act that you use humanity\u2026\" (Kant, LE p.92).**\n  1. Persons are ends in themselves because they are rational and autonomous; things have only relative worth.\n  2. The key word is *merely*: the consent test (\"cannot possibly agree\").\n  3. It closes the gap FUL leaves (slavery, tyranny of the majority, L7 s14) and forbids harvesting organs in the patient's dilemma.\n- **\"Virtue, then, is a state of character concerned with choice, lying in a mean\u2026\" (Aristotle, *NE* II, LE p.147).**\n  1. Genus: a *state of character*, not a passion or a faculty.\n  2. The mean is *relative to us* (Milo), not arithmetic, and it is excellence, not mediocrity.\n  3. It is fixed by the *man of practical wisdom*, so moral virtue depends on the intellectual virtue of phronesis.\n- **\"Neither by nature, then, nor contrary to nature\u2026\" (Aristotle, LE p.144).**\n  1. Moral virtue comes from *habit*, intellectual virtue from *teaching*.\n  2. Stone example: what is by nature can't be habituated, so virtue isn't natural.\n  3. We have the capacity by nature and perfect it by practice, hence moral education and learning by doing.\n- **\"Once the rockets go up / Who cares where they come down\u2026\" (Tom Lehrer on von Braun, quoted vdP p.22).**\n  1. It satirises *separatism* and the tripartite model.\n  2. It shows the \"hired gun\": technological enthusiasm cut off from consequences.\n  3. Contrast the human-welfare ideal and active responsibility. Link to Arendt and Eichmann on the failure to think.\n\n**Others (from the slides)**\n- Bentham: \"two sovereign masters, pain and pleasure\" (L6 s7)\n- Mill: \"better to be Socrates dissatisfied than a fool satisfied\" (L6 s13)\n- Singer: \"we ought to give the money away, and it is wrong not to do so\" (L6 s16)\n- Smart: \"superstitious rule-worship\" (L6 s25)\n- Foot, on the DDE: \"it is sometimes permissible to bring about by oblique intention what one may not directly intend\" (L7 s30)\n- Hursthouse: \"An action is right iff it is what a virtuous agent would characteristically do in the circumstances\" (L8 s7)\n- Heinlein: \"Specialization is for insects.\" (L8 s32)\n- Arendt: \"Could the activity of thinking as such\u2026 be among the conditions that make men abstain from evil-doing\" (L9 s36)\n\n### 9.3 Arguments you must be able to reproduce\n1. **Good will:** talents and fortune can be bad, the good will cannot, so it alone is unconditionally good.\n2. **From duty vs in conformity with duty:** shopkeeper \u2192 philanthropist \u2192 moral worth lies in the maxim.\n3. **FUL applied to the false promise:** maxim \u2192 universalize \u2192 the institution of promising collapses \u2192 contradiction \u2192 impermissible (perfect duty).\n4. **FUL applied to non-beneficence:** a world without mutual help is conceivable, but you cannot will it, because you'll need help yourself (imperfect duty).\n5. **FH:** rational beings are ends in themselves \u2192 never treat them merely as means (consent test).\n6. **The trolley/patient asymmetry:** via the DDE, or via Foot's negative vs positive duties.\n7. **Aristotle's function argument:** excellence = doing one's function well; the human function is rationality; so virtue makes us live rationally well.\n8. **Acquisition by habit:** \"neither by nature nor contrary to nature\"; stone example; learning by doing.\n9. **Genus and differentia:** passions, faculties, states \u2192 virtue is a state disposed to the mean \u2192 THE DEFINITION.\n10. **The circularity puzzle and the three conditions.**\n11. **The four conditions of blameworthiness applied to Challenger.**\n12. **Why efficiency is value-laden:** it presupposes an external goal and a choice of inputs.\n13. **Against technocracy:** no expertise about ends, and it is paternalistic and so violates autonomy.\n14. **The social context both diminishes and extends engineers' responsibility.**\n15. **Smart's rule-worship dilemma:** RU collapses into AU or becomes deontology.\n\n### 9.4 Prioritised last-minute checklist\n1. \u2610 Recite THE DEFINITION of virtue and the Kant FH formula word for word.\n2. \u2610 List: 3 forms of passive responsibility, 4 conditions, each with a Challenger fact.\n3. \u2610 List: 5 intellectual virtues with a one-line gloss each; teaching vs habit; how they relate.\n4. \u2610 Kant: hypothetical vs categorical; FUL; three-part test; fairness, consistency, humanity; means vs end, with examples.\n5. \u2610 The four Kant examples: which are perfect and which imperfect.\n6. \u2610 The three Aristotelian conditions; mean relative to us (Milo); no mean for murder.\n7. \u2610 Roles: formal/informal, moral vs professional, Ross, plus a full util/Kant/virtue response to Boisjoly.\n8. \u2610 The three ideals with one example each; separatism, technocracy, whistle-blowing with one problem each; De George's 5.\n9. \u2610 The trolley, DDE, Foot, Knobe paragraph.\n10. \u2610 Experience machine: 4 reasons not to plug in (L4 s16\u201318), in case of another 2024-Q2-style question.\n11. \u2610 The comparison table in Part 6.\n12. \u2610 Collingridge and CTA; diminishes vs extends.\n\n### 9.5 Self-test (answer each in 300\u2013400 words under a 17-minute timer)\n1. What is moral responsibility? Distinguish active and passive responsibility; explain the three forms of passive responsibility and the four conditions of blameworthiness with reference to Challenger.\n2. How do roles relate to responsibilities? Analyse a moral vs professional conflict from utilitarian, Kantian and virtue-ethical standpoints using a real case.\n3. What is virtue and how is it acquired, for Aristotle? How are the intellectual and moral virtues related?\n4. Distinguish means and ends in themselves. Show how fairness, consistency and humanity work in Kant's ethics.\n5. \"A good will\u2026 like a jewel\u2026 would still shine by itself.\" Identify the author and explain, contrasting with utilitarianism.\n6. Explain Aristotle's doctrine of the mean. Is it a doctrine of moderation? Do all actions admit of a mean?\n7. Is efficiency a morally neutral engineering ideal? Discuss with reference to the professional ideals of engineers.\n8. Evaluate separatism, technocracy and whistle-blowing as models for the engineer\u2013manager relationship.\n9. Compare Kant and Aristotle on the place of emotion and inclination in moral action.\n10. Distinguish the trolley problem from the patient's dilemma using the DDE and Foot's negative/positive duties. How would Kant respond?\n11. Can an AI system be morally responsible? Use the four conditions and Kant's distinction between acting from duty and in accordance with duty.\n12. Explain the Collingridge dilemma. Does the social context of technology diminish or extend engineers' responsibility?\n\n---\n\n## PART 10: Solved previous-year questions\nEach answer is written at exam length and follows the marking pattern in the answer keys: **bold label, then a description**, with every part of the question answered under its own heading.\n\n### 10.1 End-semester 2024 (answer any 3 of 5; 3 \u00d7 10)\n\n**Q1. What is moral responsibility? Distinguish active and passive responsibility. Describe the three forms of passive responsibility and the four conditions under which they come about.**\n\n**Moral responsibility.** To be responsible is, first of all, to be *\"held accountable for your actions and for the effects of your actions\"* (vdP p.9). A responsible person is open to praise, blame, punishment or reward (L9 s10). Choices, decisions and *failures to act* all count as actions: *\"Failing to save a child who is drowning is therefore also a type of action\"* (vdP p.9). **Moral** responsibility rests on moral norms and duties. It differs from **role** responsibility: it can extend beyond a role and can also limit it (vdP p.10).\n\n**Active vs passive responsibility.**\n- **Active (forward-looking):** responsibility *before* something happens, *\"a duty or task to care for certain state-of-affairs or persons\"* (vdP p.9). It isn't mainly about blame. It needs a positive attitude, a virtue (vdP p.13). Bovens lists five features: perceiving threatened violations of norms; considering consequences; autonomy; conduct based on a consistent code; taking role obligations seriously.\n- **Passive (backward-looking):** applies *after* something undesirable has happened. The person must give an account of why they acted as they did (vdP p.10).\n\n**The three forms of passive responsibility** (vdP pp.10\u201311):\n1. **Accountability:** having to justify one's actions to those entitled to demand it. Example: NASA had to account to the victims' families, the public and the court.\n2. **Blameworthiness:** being a proper target of blame for one's actions or their consequences. If you can't give a satisfactory account, you are blameworthy (vdP p.28).\n3. **Liability:** legal responsibility, such as damages or punishment.\n\n**The four conditions of blameworthiness** (vdP pp.11\u201313), applied to the 1986 Challenger disaster:\n1. **Wrong-doing:** a norm was violated. NASA reversed the burden of proof, asking engineers to prove the launch was *unsafe*, though its own policy required proof that it was *safe*.\n2. **Causal contribution:** the person's act or omission was a necessary part of the causal chain. Both NASA and Thiokol management had to approve the launch, and either could have stopped it.\n3. **Foreseeability:** the consequences could reasonably have been known. Everyone knew the O-rings eroded at low temperatures, even without conclusive proof.\n4. **Freedom:** the person wasn't acting under compulsion (\"ought implies can\"). Schedule pressure, the publicity around McAuliffe and Thiokol's contract weighed on the decision. Boisjoly feared for his job. None of this amounted to compulsion.\n\n**Inference.** *\"The extent to which you can be blamed is determined by the degree to which these conditions are fulfilled\"* (vdP p.11). So blame comes in **degrees**. NASA and Thiokol management are clearly blameworthy. Boisjoly's responsibility is **reduced** but not removed, because he faced real personal costs and had little influence.\n\n---\n\n**Q2. Outline Nozick's experience machine. What is its intention? Give four reasons not to plug in. Would you plug in?**\n\n**The thought experiment** (L4 s15). Imagine a virtual-reality machine that gives you a lifetime of the best experiences you could want. Once plugged in, you don't know you're in a machine and you believe you're really doing everything you enjoy. Compare this with a person who *actually* does and enjoys those things. Most of us judge the real life better, even though both contain *the same amount of happiness*.\n\n**Its intention.** To refute **hedonism**, the view that pleasure (pleasant experience) is the only intrinsic good and that a life goes well exactly as far as it is happy. If hedonism were true, the two lives would be equally good. Since they aren't, something besides experience matters. It extends the **argument from false happiness** (L4 s14).\n\n**Four reasons not to plug in** (L4 s16\u201319):\n1. **We want to *do* things,** not just have the experience of doing them.\n2. **We want to *be* a certain kind of person,** courageous, kind or loving. A body floating in a tank isn't anyone in particular. (Compare Aristotle: virtue is a state of character built through real action.)\n3. **Contact with reality.** The machine confines us to a human-made world, with no contact with any deeper reality. Related to this, **almost all our beliefs would be false**: your pride at being a great violinist would rest on an illusion (L4 s17).\n4. **Community and the full range of emotion.** We are *zoon politikon* (Aristotle). The machine is solipsistic, cuts us off from solidarity with others, and narrows us to pleasant feelings when sorrow, heartbreak and companionship are also part of being human (L4 s18).\n- *(Also usable: **autonomy** has value even when it doesn't make us happy (L4 s19). Our **responsibility** to a world that needs our action. Mill's **higher pleasures** of an active intellect, which the Quiz-1 2026 key explicitly rewarded as a link.)*\n\n**My verdict: stay out.** The machine gives me pleasure, but it takes away the things that make pleasure worth having: real achievement, real relationships, a character I actually formed, and true beliefs about my life. As Socrates says, *\"the unexamined life is not worth living\"* (L4 s15), and a life in the machine can't be examined. A hedonist could reply that I would never know the difference. But I'm judging the two lives *now*, from outside the machine, and that judgment itself shows I value more than experience.\n\n---\n\n**Q3, Q4, Q5:** see **Model Answers 1, 2 and 3** in Part 8.5.\n\n### 10.2 Quiz-1 2026 (answer any 3 of 4; 3 \u00d7 5). Answers follow the professor's own key\n\n**Q1. Reconstruct Midgley's \"moral isolationism\" as the standard relativist argument. Give two flaws.**\n1. **Descriptive relativism:** cultures differ in their fundamental beliefs about value. *Midgley:* in samurai Japan there was a custom of \"trying out one's new sword\" on a chance stranger.\n2. **Ethical relativism:** what is right in one culture may be wrong in another; there are no universal moral truths. *Midgley:* the isolationist says we can understand only our own culture, so right and wrong are relative to it.\n3. **Prescriptive relativism:** so it is wrong to judge other cultures. *Midgley:* this is **moral isolationism**: we may not criticise any other culture, and moral judgment is \"a kind of coinage valid only in its country of origin.\"\n\n**Flaws:**\n- **Is to ought:** step 1 states a fact about what people believe, and step 2 draws a conclusion about what is right. That is an unjustified jump from what *is* believed to what *ought* to be.\n- **Self-refutation:** if nothing is universally wrong (step 2), then \"judging other cultures is wrong\" can't be universally true either, so step 3 contradicts step 2.\n- *(Also accepted: values shared across cultures exist; the move from belief to truth.)*\n\n**Q2. How does Mackie's error theory differ from emotivism? Outline the argument from queerness.**\n- **Error theory: a cognitivist theory.** Moral judgments express **beliefs** and aim at truth, but because there are no objective moral facts, they are **always false**.\n- **Emotivism: a non-cognitivist theory.** Moral judgments don't express beliefs. They express **feelings of approval or disapproval** (\"Boo!/Hurrah!\"), so they are neither true nor false.\n- **The argument from queerness:**\n  - **Metaphysical part:** if objective values existed, they would be entities, qualities or relations of a very strange sort, utterly unlike anything else in the universe. They would have to be *intrinsically action-guiding*, giving reasons to act whatever one desires.\n  - **Epistemological part:** if we knew them, it would have to be through some special faculty of moral perception or intuition, utterly unlike our ordinary ways of knowing.\n\n**Q3. Who wrote \"It is better to be a human being dissatisfied than a pig satisfied\u2026\"? Give three points of significance.**\n- **Author: John Stuart Mill**, *Utilitarianism* (1863).\n1. **Quality, not only quantity:** some kinds of pleasure are more desirable and valuable than others. Against Bentham's purely quantitative calculus, Mill says it would be absurd to judge pleasures by quantity alone.\n2. **Higher faculties:** humans have faculties higher than animal appetites, and once aware of them don't count anything as happiness that leaves them unsatisfied. This answers the charge that utilitarianism is a \"doctrine worthy only of swine\".\n3. **Competent judges:** only those who know both kinds of pleasure can rank them, and they prefer the higher. The fool and the pig \"only know their own side of the question.\"\n- *(Bonus link rewarded by the key:* this explains, from within utilitarianism, why one should **not plug into Nozick's experience machine**.)\n\n**Q4. The patient's dilemma under act- and rule-utilitarianism.**\n- **Act-utilitarianism.** **(a)** Sacrifice the one healthy man to save the five. **(b)** It produces the greatest good for the greatest number: five lives against one. **Limitation:** no room for **rights or moral desert**; the innocent man is sacrificed. *(Also accepted: it needs knowledge of counterfactuals; it erases supererogation; it is too demanding.)*\n- **Rule-utilitarianism.** **(a)** Don't sacrifice him. **(b)** The right act follows an **optimific social rule**. A rule letting doctors harvest healthy visitors would make the world worse, because no one healthy would go near a hospital. **Limitation:** **irrational rule-worship** (Smart): following the rule even when breaking it would produce more good. And if exceptions are added, it collapses back into act-utilitarianism.\n\n### 10.3 Quiz-1 2024 (Section A compulsory 2 \u00d7 2; Section B any 2 \u00d7 3). Answers follow the 2024 key\n**Q1(a). \"Ought implies can\" vs \"can implies ought.\"**\n- **Ought implies can:** if someone is obliged to do something, they must be able to do it. Capability is a necessary condition of obligation.\n- **Can implies ought:** the fallacy of inferring that because one *can* do something, one *should*. In effect, might makes right.\n\n**Q1(b). Egoism vs relativism.**\n- **Ethical egoism:** morality is relative to the *self*. It is right to do whatever is in your own long-term interest, and you have no duties to others beyond that.\n- **Relativism:** morality is relative to *culture*. Right is whatever one's culture or tradition approves.\n\n**Q2. Moral realism vs moral skepticism; two ways of attaining moral knowledge.**\n- **Realism:** there are objective moral truths. **Skepticism** (egoism, relativism, error theory): there are none, or we can't know them.\n- **Ways of knowing, for the realist** (L2 s5, s12, s15):\n  - **A priori reason or intuition:** we know stealing is wrong from the concept itself, as we know truths of mathematics. Russell held that judgments of intrinsic value are immediate and a priori.\n  - **Experience (a posteriori):** perceiving moral features of situations.\n  - *(Also cited in the slides: the common moral sentiments of Hume and Smith, and Kant's common human reason, L2 s22.)*\n\n**Q3. Hedonism vs desire-satisfaction theory; two limitations of hedonism.**\n- **Hedonism:** pleasure, and the absence of pain, is the only intrinsic good.\n- **Desire-satisfaction theory:** what is intrinsically good for you is whatever satisfies your desires.\n- **Two limitations:**\n  - **Evil pleasure:** hedonism can't tell happiness from cruelty apart from happiness from kindness.\n  - **False happiness:** it can't tell happiness based on true beliefs from happiness based on false ones (the experience machine).\n  - *(Also accepted: autonomy has value even when it brings pain; we want to do and be things, not merely experience them.)*\n\n**Q4. The standard relativist argument, with one flaw.** See 10.2 Q1:\n1. Descriptive relativism: cultures differ.\n2. Ethical relativism: there are no universal moral truths.\n3. Prescriptive relativism: don't judge others.\n- **Flaw:** the move from belief to truth. That a culture *believes* something is right doesn't make it right.\n\n### 10.4 Pop quiz 2024 (MCQs): answers with reasons\n| Q | Answer | Why (source) |\n|---|---|---|\n| 1 | **b** | Kant: theory of the right; utilitarianism: theory of the good (L7 s5) |\n| 2 | **c** Rule-utilitarianism | The three-step optimific-rule test (L6 s19) |\n| 3 | **a** | Moral laws are necessary and apply to all *rational* beings |\n| 4 | **d** a good will | LE p.86 |\n| 5 | **d** consistency and fairness | L7 s13 |\n| 6 | **a** | A maxim is the principle one acts on (LE p.90 n.1) |\n| 7 | **c** categorical | L7 s9 |\n| 8 | **d** | LE p.92 |\n| 9 | **b** one's own will | Autonomy (L7 s15) |\n| 10 | **d** Golden Rule | L7 s11 |\n| 11 | **c** Mill | L6 s13 |\n| 12 | **c** I, II and III | DDE (L7 s30) |\n| 13 | **a** | Moral flexibility is an *attraction* of utilitarianism, not a limitation (L6 s20) |\n| 14 | **c** Foot | L7 s26 |\n| 15 | **b** | The Golden Rule is rejected as a standard (L7 s11) |\n| 16 | **c** \"cheating is wrong\" | The only one that doesn't depend on a desire |\n| 17 | **a** | Knobe effect (L7 s22\u201324) |\n| 18 | **d** | L6 s21 |\n| 19 | **a** the principle of utility | |\n| 20 | **c** pain and pleasure | L6 s7 |\n\n*The answers marked on the scanned key don't come through in the extracted text. These were worked out from the slides, so check them against the scan.*\n\n---\n\n*Lower priority (skim only): the supplementary books in this folder (Edmonds,* Would You Kill the Fat Man*; Lipscomb; Mac Cumhaill & Wiseman; de Waal; Kowalski; Criado Perez; Andy West; Isaacson). They are background for the trolley problem and the \"four women\" (Anscombe, Foot, Midgley, Murdoch) the slides mention, but they are not on the end-sem syllabus. Hospers Ch.8 (`.ps` file) supports L1\u20132 meta-ethics only.*\n";</script>

  kant:['readings/Kant_Good_Will_and_Categorical_Imperative_LE_pp86-93.pdf',85],
  ari:['readings/Aristotle_Nicomachean_Ethics_LE_pp143-150.pdf',142],
  sl10:['readings/ShaferLandau_Ch10_Virtue_Ethics_LE_pp134-143.pdf',133],
  le:['Russ Shafer-Landau_Living Ethics An Introduction with Readings.pdf',-17],
  vdp:['Chapter 1_The responsibilities of engineers (from Ibo van de Poel, Lambèr Royakkers - Ethics, Technology, and Engineering).pdf',5],
};
const SLIDES=['BoE_01_Introduction.pdf','BoE_02_Cognitivism, Non-cognitivism, DCT.pdf','BoE_03_Moral Skepticism.pdf','BoE_04_Hedonism.pdf','BoE_05_From hedonism to utilitarianism.pdf','BoE_06_Utilitarianism_Act and Rule.pdf','BoE_07_Kants deontological ethics and the trolley problem.pdf','BoE_08_Aristotle and Virtue Ethics.pdf','BoE_09_Ethics, Engineering, and Responsibility.pdf'];
const FILES={'BoE_end_2024_M.pdf':'BOE/VijayrajS-iiitprevpapers/Year4/CS/BOE-Basics of Ethics/BoE_end_2024_M.pdf','BoE_quiz1_2024_M_key.pdf':'BOE/VijayrajS-iiitprevpapers/Year4/CS/BOE-Basics of Ethics/BoE_quiz1_2024_M_key.pdf','Quiz-1_answer key-1.pdf':'Quiz-1_answer key-1.pdf','Endsem.jpg':'Endsem.jpg','Quiz-1.jpeg':'Quiz-1.jpeg'};
SLIDES.forEach((f,i)=>FILES['BoE_0'+(i+1)]=f);
function leFile(a,b){b=b||a;
  if(a>=86&&b<=93)return F.kant;
  if(a>=143&&b>=144)return F.ari; if(a>=144&&a<=150)return F.ari;
  if(a>=134&&b<=143)return F.sl10;
  return F.le;}
function link(href,text,tip){return `<a class="cite" href="${href}" target="_blank" rel="noopener" title="${tip}">${text}</a>`}
function cite(html){
  // LE p.86 / LE pp.87–88 / LE p.144–145
  html=html.replace(/\bLE (pp?\.)\s?(\d{2,3})(?:[–-](\d{2,3}))?/g,(m,pp,a,b)=>{const [f,off]=leFile(+a,b&&+b);const pg=+a-off;
    return link(enc(f),m,`Living Ethics p.${a}${b?'–'+b:''} → open ${f.split('/').pop()}, go to PDF page ${pg}`)});
  html=html.replace(/\bvdP (pp?\.)\s?(\d{1,2})(?:[–-](\d{1,2}))?/g,(m,pp,a,b)=>link(enc(F.vdp[0]),m,`van de Poel & Royakkers p.${a}${b?'–'+b:''} → PDF page ${+a-F.vdp[1]}`));
  // L7 s13, L7 s8, s13 and s14, L9 s16–20
  html=html.replace(/\bL([1-9]) (s\d+(?:[–-]\d+)?(?:(?:,\s?| and | \/ )s\d+(?:[–-]\d+)?)*)/g,(m,l,rest)=>{
    const f=enc(SLIDES[l-1]);
    return `L${l} `+rest.replace(/s(\d+)(?:[–-](\d+))?/g,(x,a)=>link(f,x,`Lecture ${l}, slide ${a} → PDF page ${a}`));});
  return html;}
function walk(node){
  for(const n of [...node.childNodes]){
    if(n.nodeType===3){const t=n.textContent;if(/\b(LE pp?\.|vdP pp?\.|L[1-9] s\d)/.test(t)){const s=document.createElement('span');s.innerHTML=cite(t.replace(/&/g,'&amp;').replace(/</g,'&lt;'));n.replaceWith(...s.childNodes)}}
    else if(n.nodeType===1&&!/^(A|PRE|CODE|SCRIPT)$/.test(n.tagName))walk(n);}}
const slug=s=>s.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,60);

if(typeof marked==='undefined')document.getElementById('c').innerHTML='<p><b>The page could not load its reader script.</b> Try a hard refresh (Ctrl+Shift+R) or disable ad-blockers for this site.</p>';
Promise.resolve({ok:true,text:()=>Promise.resolve(window.__MD)}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(md=>{
  md=md.replace(/^- ☐ /gm,'- [ ] ').replace(/^(\d+)\. ☐ /gm,'- [ ] ');
  const c=document.getElementById('c');
  c.innerHTML=marked.parse(md,{gfm:true});
  c.querySelectorAll('table').forEach(t=>{const d=document.createElement('div');d.className='tw';t.replaceWith(d);d.appendChild(t)});
  c.querySelectorAll('code').forEach(k=>{const t=k.textContent.trim();const key=Object.keys(FILES).find(x=>t===x||t.startsWith(x));
    if(key&&!k.closest('pre')){const a=document.createElement('a');a.href=enc(FILES[key]);a.target='_blank';a.className='cite';a.textContent=t;a.title='Open source file';k.replaceWith(a)}});
  walk(c);
  glossary(c);
  // checklist persistence
  c.querySelectorAll('li input[type=checkbox]').forEach((cb,i)=>{const li=cb.closest('li');li.classList.add('task');cb.disabled=false;
    const k='boe-chk-'+i;cb.checked=localStorage.getItem(k)==='1';li.classList.toggle('done',cb.checked);
    cb.onchange=()=>{localStorage.setItem(k,cb.checked?'1':'0');li.classList.toggle('done',cb.checked)}});
  // TOC
  const toc=document.getElementById('toc');const hs=[...c.querySelectorAll('h2,h3')];
  hs.forEach(h=>{h.id=h.id||slug(h.textContent);const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent.replace(/^PART (\d+):\s*/,'$1 · ').replace(/\s*\(.*$/,'').replace(/^(.{10,}?)\.\s(?=[A-Z]).*$/,'$1');a.className=h.tagName.toLowerCase();toc.appendChild(a);a.onclick=closeMenu});
  const links=[...toc.querySelectorAll('a')];
  const group=new Map();let cur2=null;links.forEach(l=>{if(l.classList.contains('h2'))cur2=l;group.set(l,cur2)});
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const act=links.find(l=>l.getAttribute('href')==='#'+e.target.id);if(!act)return;const parent=group.get(act);
    links.forEach(l=>{l.classList.toggle('on',l===act||l===parent&&act!==parent);if(l.classList.contains('h3'))l.classList.toggle('show',group.get(l)===parent)});
    if(!toc.classList.contains('open'))act.scrollIntoView({block:'nearest'})}),{rootMargin:'-10% 0px -80% 0px'});
  hs.forEach(h=>io.observe(h));
  if(location.hash){var t0=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t0)t0.scrollIntoView();}
  setupSearch(c);
}).catch(e=>{document.getElementById('c').innerHTML='<p><b>Could not load the guide</b> ('+e.message+'). Try a hard refresh (Ctrl+Shift+R).</p>'});
function glossary(c){
  const det=c.querySelector('details');if(!det)return;
  const G=[...det.querySelectorAll('tbody tr')].map(r=>[r.cells[0].textContent.trim(),r.cells[1].innerHTML]).filter(x=>x[0].length>2);
  G.sort((a,b)=>b[0].length-a[0].length);
  const esc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('\\b('+G.map(g=>esc(g[0])).join('|')+')\\b','i');
  const map=Object.fromEntries(G.map(g=>[g[0].toLowerCase(),g]));
  let seen=new Set();
  const nodes=[];const w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT);
  while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){
    const pe=n.parentElement;
    if(pe.closest('h2'))seen=new Set();
    if(pe.closest('details,h1,h2,h3,h4,a,code,pre,summary,span.g'))continue;
    let t=n.textContent,m,frag=null,last=0,node=n;
    const r=new RegExp(re.source,'gi');const parts=[];
    while((m=r.exec(t))){const k=m[1].toLowerCase();if(seen.has(k)||!map[k])continue;seen.add(k);parts.push([m.index,m[0],map[k]]);}
    if(!parts.length)continue;
    frag=document.createDocumentFragment();
    for(const [i,txt,g] of parts){frag.append(t.slice(last,i));const sp=document.createElement('span');sp.className='g';sp.tabIndex=0;sp.textContent=txt;sp.dataset.t=g[0];sp.dataset.d=g[1];frag.append(sp);last=i+txt.length}
    frag.append(t.slice(last));n.replaceWith(frag);
  }
  const tip=document.getElementById('tip');
  const show=e=>{const sp=e.target.closest('span.g');if(!sp)return;tip.innerHTML='<b>'+sp.dataset.t+'</b>'+sp.dataset.d;tip.style.display='block';
    const r=sp.getBoundingClientRect();let x=r.left+scrollX;const W=Math.min(352,innerWidth-24);tip.style.maxWidth=W+'px';
    x=Math.max(12,Math.min(x,scrollX+innerWidth-W-12));tip.style.left=x+'px';tip.style.top=(r.bottom+scrollY+8)+'px'};
  const hide=e=>{if(!e.target.closest||!e.target.closest('span.g'))tip.style.display='none'};
  c.addEventListener('mouseover',show);c.addEventListener('focusin',show);c.addEventListener('click',e=>{show(e);});
  c.addEventListener('mouseout',e=>{if(e.target.closest('span.g'))tip.style.display='none'});
  document.addEventListener('click',hide);addEventListener('scroll',()=>tip.style.display='none');
}
function setupSearch(c){
  const blocks=[...c.children];const q=document.getElementById('q');
  q.oninput=()=>{const v=q.value.trim().toLowerCase();
    c.querySelectorAll('mark').forEach(m=>m.replaceWith(...m.childNodes));
    if(v.length<3){blocks.forEach(b=>b.classList.remove('hidden'));return}
    let cur=null;blocks.forEach(b=>{if(/^H[23]$/.test(b.tagName))cur=b;const hit=b.textContent.toLowerCase().includes(v);b.classList.toggle('hidden',!hit&&!/^H[12]$/.test(b.tagName));if(hit&&cur)cur.classList.remove('hidden')});
    blocks.filter(b=>!b.classList.contains('hidden')).forEach(b=>mark(b,v));};}
function mark(el,v){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const i=n.textContent.toLowerCase().indexOf(v);if(i<0)return;const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+v.length);const m=document.createElement('mark');r.surroundContents(m)});}
// chrome
const root=document.documentElement;const saved=localStorage.getItem('boe-theme');
if(saved?saved==='dark':matchMedia('(prefers-color-scheme: dark)').matches)root.dataset.theme='dark';
document.getElementById('theme').onclick=()=>{const d=root.dataset.theme==='dark';root.dataset.theme=d?'':'dark';localStorage.setItem('boe-theme',d?'light':'dark')};
function closeMenu(){document.getElementById('toc').classList.remove('open');document.getElementById('shade').classList.remove('on')}
document.getElementById('menu').onclick=()=>{const t=document.getElementById('toc');const o=t.classList.toggle('open');document.getElementById('shade').classList.toggle('on',o);if(o)t.querySelectorAll('a.h3').forEach(a=>a.classList.add('show'))};
document.getElementById('shade').onclick=closeMenu;
addEventListener('scroll',()=>{const h=document.documentElement;document.getElementById('bar').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';document.getElementById('top').style.display=h.scrollTop>800?'block':'none'});
</script>
